<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b5e20">
<title>Casas y Pensiones · Corte Alto</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--v:#1b5e20;--vc:#e8f5e9;--r:#c62828;--rc:#ffebee;--ac:#fff8e1;--am:#6d4600;--g:#566a74;--bd:#dfe3e6;--bg:#f4f6f5;--tx:#1f2a24}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{background:linear-gradient(135deg,#1b5e20,#2e7d32);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;height:56px}
header a{color:#fff;text-decoration:none;font-size:24px;line-height:1}
header h1{font-size:17px;margin:0;font-weight:600}
header small{display:block;font-size:11px;opacity:.9;font-weight:400}
.banner{background:var(--r);color:#fff;padding:10px 14px;font-size:13px;display:none}
.red{display:none;padding:8px 14px;font-size:13px;text-align:center;line-height:1.35}
.red.off{display:block;background:#455a64;color:#fff}
.red.pend{display:block;background:var(--ac);color:var(--am)}
.red.ok{display:block;background:var(--vc);color:var(--v)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:56px;z-index:19}
.tabs button{flex:1;border:0;background:none;padding:13px 2px;font-size:14px;color:var(--g);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--v);border-bottom-color:var(--v);font-weight:600}
main{max-width:780px;margin:0 auto;padding:12px}
.sec{display:none}.sec.on{display:block}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--v)}
label.l{display:block;font-size:12px;color:var(--g);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid #b9c3c0;border-radius:8px;font-size:15px;background:#fff;color:var(--tx);font-family:inherit;min-height:44px}
input:disabled{background:#eef1ef;color:var(--g)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:8px;padding:11px 14px;font-size:15px;cursor:pointer;background:#eceff1;color:var(--tx);min-height:44px}
.btn.p{background:var(--v);color:#fff;font-weight:600}
.btn.d{background:var(--rc);color:var(--r)}
.btn.o{background:#fff;border:1px solid var(--v);color:var(--v);font-weight:600}
.btn.w{width:100%}
.btn:disabled{opacity:.6}
.fila-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.muted{color:var(--g);font-size:13px;line-height:1.4}
.err{outline:3px solid #f48fb1;outline-offset:2px}
.eess{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr) 40px 32px;gap:6px;align-items:center;margin-bottom:6px}
.eess input{padding:8px 6px}
.eess .h{font-size:11px;font-weight:600;color:var(--g)}
.eess .t{font-weight:700;text-align:center}
.ic{border:0;background:none;font-size:18px;cursor:pointer;padding:2px;min-height:40px;color:var(--r)}
.prog{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.prog .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.bar{height:8px;background:#e6eae8;border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--v)}
.achips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.achips button{height:40px;border:1px solid #b9c3c0;background:#fff;border-radius:8px;font-size:14px;cursor:pointer;color:var(--tx)}
.achips button.ok{background:var(--vc);border-color:#a5d6a7;color:var(--v);font-weight:600}
.achips button.par{background:var(--ac);border-color:#e0a800;color:var(--am);font-weight:600}
.achips button.act{outline:2px solid var(--v);outline-offset:1px}
.ahead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.ahead h2{font-size:18px;margin:0;line-height:1.25}
.nchip{flex:0 0 auto;min-width:66px;padding:6px 8px;text-align:center;border-radius:8px}
.nchip small{display:block;font-size:11px;font-weight:600}
.nchip b{font-size:22px;line-height:1.1}
.verde{background:#dff0e0;color:#14501a}.amarillo{background:#fff0bf;color:#5c4300}.rojo{background:#fbdcd8;color:#8e1c1c}.sin{background:#eceff1;color:var(--g)}
.item{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:13px;margin-bottom:10px}
.item .q{font-size:15px;font-weight:500;line-height:1.35}
.pts{float:right;font-size:12px;color:var(--g);font-weight:600;margin-left:10px}
.ay{font-size:12px;color:var(--g);margin:4px 0 0}
.notas{display:grid;grid-template-columns:repeat(5,1fr) 1.2fr;gap:6px;margin-top:10px}
.notas button{height:44px;border:1px solid #b9c3c0;border-radius:8px;background:#fff;font-size:15px;font-weight:700;color:var(--tx);cursor:pointer;padding:0}
.notas button.on{background:var(--v);border-color:var(--v);color:#fff}
.extra{display:none;margin-top:8px}.extra.on{display:block}
.fotos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.foto{position:relative}
.foto img,.fotos>img{width:68px;height:68px;object-fit:cover;border-radius:6px;border:1px solid var(--bd);display:block}
.foto button{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:#263238;color:#fff;font-size:13px;cursor:pointer;padding:0}
.fotobtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;font-size:14px;font-weight:600;padding:8px 10px;margin-top:8px;border-radius:8px;background:#fff;color:var(--v);cursor:pointer;border:1px solid var(--v)}
.res{border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.res small{display:block;font-size:13px;font-weight:600}
.res b{font-size:38px;line-height:1.1}
.res .cl{grid-column:1/-1;font-weight:700;font-size:14px}
.arow{padding:7px 0}
.arow .t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.arow .t b{flex:0 0 auto}
.arow .m{font-size:12px;color:var(--g);margin-top:3px}
.bar i.verde{background:#2e7d32}.bar i.amarillo{background:#e0a800}.bar i.rojo{background:#c62828}.bar i.sin{background:#b0bec5}
.acc{border-top:1px solid var(--bd);padding:12px 0}
.acc:first-of-type{border-top:0}
.acc .tit{font-size:14px;font-weight:600;line-height:1.35}
.chip{display:inline-block;font-size:12px;border-radius:6px;padding:3px 8px;font-weight:700}
.filt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.filt button{min-height:44px;border:1px solid #b9c3c0;border-radius:8px;background:#fff;font-size:14px;font-weight:600;color:var(--tx);cursor:pointer}
.filt button.on{background:var(--v);border-color:var(--v);color:#fff}
.lista{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lista>div:first-child{min-width:0;overflow-wrap:anywhere}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:780px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.mhead h2{margin:0;font-size:17px;min-width:0;overflow-wrap:anywhere}
.mhead button{border:0;background:#eceff1;border-radius:8px;width:44px;height:44px;font-size:16px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#263238;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;display:none;z-index:60;max-width:90%;text-align:center}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:7px 5px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--g)}
@media(min-width:700px){.achips{grid-template-columns:repeat(10,1fr)}}
</style>
</head>
<body>
<header>
  <a href="sso.html" aria-label="Volver a SSO">←</a>
  <div><h1>Casas y Pensiones</h1><small>Lista de verificación · Versión 4</small></div>
</header>
<div class="banner" id="banner"></div>
<div class="red" id="estadoRed"></div>
<nav class="tabs">
  <button id="tb-rev" class="on" onclick="tab('rev')">Revisión</button>
  <button id="tb-his" onclick="tab('his')">Historial</button>
  <button id="tb-seg" onclick="tab('seg')">Seguimiento</button>
  <button id="tb-cfg" onclick="tab('cfg')">Config.</button>
</nav>
<main>
<section class="sec on" id="sec-rev">
  <div id="v-datos">
    <div class="card">
      <h2>Datos de la instalación</h2>
      <div class="g2">
        <div><label class="l" for="numero">Inspección N°</label><input id="numero" disabled value="Automático"></div>
        <div><label class="l" for="fecha">Fecha</label><input type="date" id="fecha" oninput="enc()"></div>
      </div>
      <label class="l" for="sInst">Instalación</label>
      <select id="sInst" onchange="elegirInst()"></select>
      <div id="nomOtro" style="display:none"><label class="l" for="nombre">Nombre de la instalación</label><input id="nombre" oninput="enc()" placeholder="Escribe el nombre"></div>
      <div class="g2">
        <div><label class="l" for="codigo">Código (opcional)</label><input id="codigo" oninput="enc()"></div>
        <div><label class="l" for="comuna">Comuna</label><input id="comuna" oninput="enc()"></div>
      </div>
      <label class="l" for="direccion">Dirección (opcional)</label><input id="direccion" oninput="enc()">
      <label class="l" for="propietario">Propietario o arrendador (nombre o razón social)</label><input id="propietario" oninput="enc()">
      <label class="l" for="concesionario">Concesionario o prestador de servicios (opcional)</label><input id="concesionario" oninput="enc()">
      <label class="l" for="ingeniero">Ingeniero de operaciones</label><input id="ingeniero" oninput="enc()">
      <label class="l" for="sRev">Revisado por</label>
      <select id="sRev" onchange="elegirRev()"></select>
      <div id="revOtro" style="display:none"><label class="l" for="revisor">Nombre de quien revisa</label><input id="revisor" oninput="enc()" placeholder="Escribe el nombre"></div>
      <label class="l" for="capacidad">Capacidad de la instalación (personas)</label><input id="capacidad" inputmode="numeric" oninput="enc();renderEess(true)">
    </div>
    <div class="card" id="cardEess">
      <h2>Empresas o usuarios alojados</h2>
      <div id="eessBox"></div>
      <button type="button" class="btn o w" onclick="addEess()">+ Agregar empresa o usuario</button>
    </div>
    <button class="btn p w" onclick="comenzar()">Comenzar pauta</button>
    <button class="btn w" style="margin-top:8px" onclick="descartar()">Descartar esta revisión</button>
  </div>
  <div id="v-pauta" style="display:none"></div>
  <div id="v-res" style="display:none"></div>
</section>
<section class="sec" id="sec-his">
  <div class="card">
    <label class="l" for="buscar" style="margin-top:0">Buscar</label>
    <input id="buscar" placeholder="Instalación, comuna, fecha o revisor" oninput="renderHis()">
  </div>
  <div id="hisLista"></div>
</section>
<section class="sec" id="sec-seg">
  <div class="card">
    <div class="filt" id="segFilt"></div>
    <label class="l" for="segInst">Instalación</label>
    <select id="segInst" onchange="renderSeg()"></select>
  </div>
  <div id="segLista"></div>
</section>
<section class="sec" id="sec-cfg"><div id="cfgBox"></div></section>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)cerrarModal()"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status"></div>

// ================= CÁLCULO =================
// Nota del área = promedio ponderado de los puntos evaluados; los N/A salen y su peso se reparte entre los demás.
// Un área completa en N/A sale de la nota final y su peso se reparte entre las otras áreas.
function calcular(resp) {
  let sA = 0, pA = 0, pend = 0;
  const areas = AREAS.map(a => {
    let s = 0, p = 0, faltan = 0, na = 0;
    a.items.forEach(it => {
      const v = (resp[it[0]] || {}).n;
      if (v === 'NA') na++;
      else if (typeof v === 'number') { s += it[1] * v; p += it[1]; }
      else faltan++;
    });
    const nota = p ? s / p : null;
    pend += faltan;
    if (nota !== null) { sA += a.peso * nota; pA += a.peso; }
    return { id: a.id, nombre: a.nombre, peso: a.peso, nota, faltan, na, total: a.items.length };
  });
  const final = pA ? sA / pA : null;
  return { areas, pend, final, cumplimiento: final === null ? null : final / 5 * 100, clase: clase(final) };
}

const colaFotos = {
  _db: null,
  abrir() {
    if (this._db) return Promise.resolve(this._db);
    if (!window.indexedDB) return Promise.reject(new Error('Este navegador no permite guardar fotos sin señal'));
    return new Promise((ok, no) => {
      const rq = indexedDB.open('cp_offline', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('fotos', { keyPath: 'key' });
      rq.onsuccess = () => { this._db = rq.result; ok(rq.result); };
      rq.onerror = () => no(rq.error);
    });
  },
  async tx(modo, fn) {
    const d = await this.abrir();
    return new Promise((ok, no) => { const t = d.transaction('fotos', modo); const r = fn(t.objectStore('fotos')); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); });
  },
  poner(f) { return this.tx('readwrite', s => s.put(f)); },
  todas() { return this.tx('readonly', s => s.getAll()); },
  quitar(k) { return this.tx('readwrite', s => s.delete(k)); },
  async contarCola() { try { return ((await this.todas()) || []).filter(f => f.estado === 'cola').length; } catch (e) { return 0; } }

async function sincronizar() {
  if (!db || !navigator.onLine || sincronizando) { actualizarEstadoRed(); return; }
  sincronizando = true;
  try {
    for (const p of pendientes.lista()) {
      try { const d = await conTimeout(db.doc(p).get({ source: 'server' }), 8000); if (d.exists) pendientes.quitar(p); } catch (e) { break; }
    }
    if (st) {
      let cola = [];
      try { cola = ((await colaFotos.todas()) || []).filter(f => f.estado === 'cola'); } catch (e) { cola = []; }
      const espera = pendientes.lista();
      for (const f of cola) {
        if (espera.includes(f.col + '/' + f.docId)) continue; // primero debe llegar el documento
        try {
          const ref = st.ref(f.path);
          await conTimeout(ref.put(f.blob, { contentType: 'image/jpeg' }), 20000);
          const url = await conTimeout(ref.getDownloadURL(), 8000);
          try {
            await conTimeout(db.collection(f.col).doc(f.docId).update({
              fotos: firebase.firestore.FieldValue.arrayUnion({ item: f.item, url, path: f.path }),
              fotosPendientes: firebase.firestore.FieldValue.increment(-1)
            }), 10000);
          } catch (e) {
            if (e && e.code === 'not-found') { try { await ref.delete(); } catch (e2) {} } else throw e;
          }
          await colaFotos.quitar(f.key);
        } catch (e) { console.warn('Foto sigue en cola', e); break; }
      }
    }
  } finally { sincronizando = false; actualizarEstadoRed(); }
}
async function actualizarEstadoRed() {
  const el = $('estadoRed'); if (!el) return;
  const nDocs = pendientes.lista().length, nFotos = await colaFotos.contarCola();
  const partes = [];
  if (nDocs) partes.push(nDocs + (nDocs === 1 ? ' registro' : ' registros'));
  if (nFotos) partes.push(nFotos + (nFotos === 1 ? ' foto' : ' fotos'));
  if (!navigator.onLine) {
    el.className = 'red off';
    el.textContent = '📴 Sin señal: puedes seguir revisando, todo queda guardado en el celular.' + (partes.length ? ' Pendientes: ' + partes.join(' y ') + '.' : '') + (window.__sinCacheLocal ? ' ⚠️ No cierres la app hasta que vuelva la señal.' : '');
  } else if (partes.length) {
    el.className = 'red pend'; el.textContent = '⏳ Enviando pendientes: ' + partes.join(' y ') + '…';
  } else if (el.classList.contains('pend') || el.classList.contains('off')) {
    el.className = 'red ok'; el.textContent = '✔ Todo enviado';
    clearTimeout(actualizarEstadoRed._t); actualizarEstadoRed._t = setTimeout(() => { el.className = 'red'; }, 4000);
  }
}

function comprimir(file, max = 1280, q = 0.7) {
  return new Promise(res => {
    if (!file.type || !file.type.startsWith('image/')) return res(file);
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(u); res(b || file); }, 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}

async function addFotos(id, input) {

    const ser = firebase.firestore.FieldValue.serverTimestamp();
    const ref = db.collection(COL).doc(B.id);
    const eess = B.eess.filter(f => f.n.trim()).map(f => ({ nombre: f.n.trim(), residentes: parseInt(f.r) || 0, movilizados: parseInt(f.m) || 0 }));
    const data = {
      numero, pautaVersion: PAUTA_VERSION, fecha: B.enc.fecha, instalacionId: B.instId || '',
      nombre: B.enc.nombre.trim(), codigo: B.enc.codigo.trim(), comuna: B.enc.comuna.trim(), direccion: B.enc.direccion.trim(),
      propietario: B.enc.propietario.trim(), concesionario: B.enc.concesionario.trim(), ingeniero: B.enc.ingeniero.trim(), revisor: B.enc.revisor.trim(),
      capacidad: parseInt(B.enc.capacidad) || 0, eess,
      items, areas: c.areas.map(a => ({ id: a.id, nombre: a.nombre, peso: a.peso, nota: a.nota, na: a.na })),
      notaFinal: c.final, cumplimiento: c.cumplimiento, clasificacion: c.clase,
      fotos: [], fotosPendientes: validas.length, creadoEn: ser
    };
    const acciones = [];
    puntosBajos().filter(id => B.plan[id].on).forEach(id => acciones.push({ punto: id, puntoTexto: PUNTOS[id].t, nota: B.resp[id].n, accion: B.plan[id].accion.trim(), responsable: B.plan[id].resp.trim(), plazo: B.plan[id].plazo }));
    B.extra.forEach(x => acciones.push({ punto: '', puntoTexto: 'Acción adicional', nota: null, accion: x.accion.trim(), responsable: x.resp.trim(), plazo: x.plazo }));
    const batch = db.batch();

    const pend = [COL + '/' + B.id], idsAcc = [];
    acciones.forEach(a => {
      const ra = db.collection(COL_ACC).doc();

    REV = REV.filter(x => x.id !== B.id); REV.unshift(guardado);

    verDetalle(guardado.id);
    actualizarEstadoRed(); setTimeout(sincronizar, 500);
  } catch (e) {
    console.error(e); toast('No se pudo guardar: ' + (e.code || e.message) + '. Tu revisión sigue como borrador.', 7000);
  } finally { const b = $('btnGuardar'); if (b) { b.disabled = false; b.textContent = 'Guardar revisión'; } }
}

async function compartirPDF(doc, nombre, titulo) {
  let file = null;
  try { file = new File([doc.output('blob')], nombre, { type: 'application/pdf' }); } catch (e) {}
  const puede = file && navigator.canShare && navigator.share && (() => { try { return navigator.canShare({ files: [file] }); } catch (e) { return false; } })();
  if (!puede) { doc.save(nombre); toast('Este dispositivo no permite compartir archivos directo; el informe se descargó ✔', 6000); return; }
  try {
    await navigator.share({ files: [file], title: titulo, text: titulo });
    toast('Informe compartido ✔');
  } catch (e) {
    if (e && e.name === 'AbortError') { toast('Compartir cancelado'); return; }
    window.__pdfPendiente = { file, titulo, doc, nombre };
    $('modalBox').innerHTML = `<div class="mhead"><h2>Informe listo</h2><button aria-label="Cerrar" onclick="cerrarModal()">✖</button></div>
      <p class="muted">${esc(nombre)}</p>
      <button class="btn p w" onclick="compartirPendiente()">📤 Compartir (WhatsApp, correo…)</button>
      <button class="btn w" style="margin-top:8px" onclick="descargarPendiente()">⬇️ Descargar</button>`;
    $('modal').classList.add('on');
  }
}

function aDataURL(blob) { return new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = no; fr.readAsDataURL(blob); }); }
async function dimImg(d) { return new Promise(res => { const im = new Image(); im.onload = () => res({ w: im.naturalWidth, h: im.naturalHeight }); im.onerror = () => res(null); im.src = d; }); }
async function imgDe(fuente, ms = 6000) {
  try {
    let blob = fuente;
    if (typeof fuente === 'string') {
      const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), ms);
      const r = await fetch(fuente, { signal: ctrl.signal }); clearTimeout(t);
      if (!r.ok) return null;
      blob = await r.blob();
    }
    const d = await aDataURL(blob), dim = await dimImg(d);
    return dim ? { d, ...dim } : null;
  } catch (e) { return null; }
}
const L1 = t => String(t ?? '').replace(/[–—]/g, '-').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/≤/g, '<=').replace(/≥/g, '>=').replace(/[^\x00-\xFF]/g, '');
async function informePDF(id) {
  const r = REV.find(x => x.id === id); if (!r) return;
  if (!window.jspdf || !window.jspdf.jsPDF) { toast('No se pudo cargar el generador de PDF. Revisa la conexión.'); return; }
  toast('Generando informe…', 8000);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, M = 14, CW = W - 2 * M;
  const VERDE = [27, 94, 32], TXT = [33, 43, 38], GRIS = [86, 106, 116];
  const COL_K = { verde: [[223, 240, 224], [20, 80, 26]], amarillo: [[255, 240, 191], [92, 67, 0]], rojo: [[251, 220, 216], [142, 28, 28]], sin: [[236, 239, 241], [86, 106, 116]] };
  const set = (c, s, b) => { doc.setTextColor(...c); doc.setFontSize(s); doc.setFont('helvetica', b ? 'bold' : 'normal'); };
  // Encabezado
  try { const ar = LOGO_CA.h / LOGO_CA.w; doc.addImage(LOGO_CA.d, 'JPEG', M, 10, 18, 18 * ar); } catch (e) {}
  set(VERDE, 13, true); doc.text('Lista de verificación para casas, residenciales,', M + 22, 16); doc.text('pensiones y hospederías', M + 22, 22);
  set(GRIS, 9); doc.text(L1(`Pauta versión 4 · 23/06/2022 · Inspección N° ${r.numero}`), M + 22, 27);
  let y = 33;
  const ca = v => L1(v || '-');
  doc.autoTable({
    startY: y, margin: { left: M, right: M }, theme: 'grid', styles: { fontSize: 9, cellPadding: 1.8, textColor: TXT, lineColor: [210, 215, 212] },
    columnStyles: { 0: { fontStyle: 'bold', cellWidth: 38 }, 2: { fontStyle: 'bold', cellWidth: 30 } },
    body: [
      ['Fecha', fmtF(r.fecha), 'Revisado por', ca(r.revisor)],
      ['Instalación', ca(r.nombre), 'Código', ca(r.codigo)],
      ['Comuna', ca(r.comuna), 'Dirección', ca(r.direccion)],
      ['Propietario/arrendador', ca(r.propietario), 'Concesionario', ca(r.concesionario)],
      ['Ingeniero operaciones', ca(r.ingeniero), 'Capacidad', String(r.capacidad ?? '-')]
    ]
  });
  y = doc.lastAutoTable.finalY + 3;
  const totR = (r.eess || []).reduce((s, f) => s + f.residentes, 0), totM = (r.eess || []).reduce((s, f) => s + f.movilizados, 0);
  doc.autoTable({
    startY: y, margin: { left: M, right: M }, theme: 'grid', styles: { fontSize: 9, cellPadding: 1.8, textColor: TXT, lineColor: [210, 215, 212] }, headStyles: { textColor: [255, 255, 255], fillColor: VERDE },
    head: [['EESS/Usuarios', 'Residentes', 'Movilizados', 'Total']],
    body: (r.eess || []).map(f => [L1(f.nombre), f.residentes, f.movilizados, f.residentes + f.movilizados]).concat([[{ content: 'Totales', styles: { fontStyle: 'bold' } }, totR, totM, totR + totM]])
  });
  y = doc.lastAutoTable.finalY + 4;
  // Resultado
  const k = clase(r.notaFinal), [fondo, tinta] = COL_K[k];

  set(tinta, 9, true); doc.text('Nota final', M + 5, y + 6); doc.text('Cumplimiento', M + 50, y + 6); doc.text('Clasificación', M + 110, y + 6);
  set(tinta, 18, true); doc.text(n1(r.notaFinal), M + 5, y + 15); doc.text(L1(p1(r.cumplimiento)), M + 50, y + 15);
  set(tinta, 11, true); doc.text(L1(CLASE_TXT[k]), M + 110, y + 14);
  y += 25;
  // Puntos por área
  AREAS.forEach(a => {
    const ar = (r.areas || []).find(x => x.id === a.id) || {};
    doc.autoTable({
      startY: y, margin: { left: M, right: M }, theme: 'grid', rowPageBreak: 'avoid',
      styles: { fontSize: 8, cellPadding: 1.5, textColor: TXT, lineColor: [210, 215, 212], overflow: 'linebreak' }, headStyles: { textColor: [255, 255, 255], fillColor: VERDE, fontSize: 9 },
      columnStyles: { 1: { cellWidth: 34 }, 2: { cellWidth: 12, halign: 'center', fontStyle: 'bold' }, 3: { cellWidth: 12, halign: 'center' } },
      head: [[`${a.id}. ${L1(a.nombre)} (pondera ${a.peso} %)`, 'Norma', 'Nota', 'Pond.']],
      body: a.items.map(it => {
        const x = (r.items || {})[sid(it[0])] || {};
        return [L1(`${it[0]} ${it[2]}`) + (x.o ? L1(`\nObs.: ${x.o}`) : ''), L1(it[3]), x.n === 'NA' ? 'N/A' : (x.n ?? '-'), it[1] + ' %'];
      }).concat([[{ content: 'Nota promedio', colSpan: 2, styles: { fontStyle: 'bold', halign: 'right' } }, { content: n1(ar.nota), styles: { fontStyle: 'bold' } }, '100 %']]),
      didParseCell: d => { if (d.section === 'body' && d.column.index === 2 && d.row.index < a.items.length) { const v = d.cell.raw; if (typeof v === 'number' && v < 5) d.cell.styles.textColor = [142, 28, 28]; } }
    });
    y = doc.lastAutoTable.finalY + 3;
  });
  // Plan de acción
  const accs = ACC.filter(a => a.revisionId === id).sort((a, b) => ordenId(a.punto) - ordenId(b.punto));
  doc.autoTable({
    startY: y, margin: { left: M, right: M }, theme: 'grid', rowPageBreak: 'avoid', styles: { fontSize: 8, cellPadding: 1.5, textColor: TXT, lineColor: [210, 215, 212] }, headStyles: { textColor: [255, 255, 255], fillColor: VERDE, fontSize: 9 },
    columnStyles: { 0: { cellWidth: 12 }, 2: { cellWidth: 34 }, 3: { cellWidth: 20 }, 4: { cellWidth: 16 } },
    head: [['Punto', 'Plan de acción', 'Responsable', 'Plazo', 'Estado']],
    body: accs.length ? accs.map(a => [L1(a.punto || '-'), L1(a.accion), L1(a.responsable), fmtF(a.plazo), a.estado === 'cerrada' ? 'Cerrada' : 'Abierta']) : [[{ content: 'Sin acciones.', colSpan: 5 }]]
  });
  y = doc.lastAutoTable.finalY + 5;
  // Fotos
  let locales = [];
  try { locales = ((await colaFotos.todas()) || []).filter(f => f.docId === id && f.estado === 'cola'); } catch (e) {}
  const fuentes = (r.fotos || []).map(f => ({ item: f.item, src: f.url })).concat(locales.map(f => ({ item: f.item, src: f.blob })))
    .sort((a, b) => ordenId(a.item) - ordenId(b.item));
  if (fuentes.length) {
    const imgs = await Promise.all(fuentes.map(f => imgDe(f.src)));
    const ancho = (CW - 8) / 3, alto = ancho * .75;
    const salto = h => { if (y + h > 285) { doc.addPage(); y = 16; } };
    salto(14 + alto); set(VERDE, 12, true); doc.text('Evidencia fotográfica', M, y + 4); y += 8;
    let col = 0;
    imgs.forEach((im, i) => {
      if (!im) return;
      if (col === 0) salto(alto + 7);
      const x = M + col * (ancho + 4), e = Math.min(ancho / im.w, alto / im.h);
      try { doc.addImage(im.d, 'JPEG', x, y, im.w * e, im.h * e); } catch (err) {}
      set(GRIS, 8); doc.text(L1(`Punto ${fuentes[i].item}`), x, y + alto + 3.5);
      col++; if (col === 3) { col = 0; y += alto + 7; }
    });
  }
  const pags = doc.internal.getNumberOfPages();
  for (let p = 1; p <= pags; p++) { doc.setPage(p); set(GRIS, 8); doc.text(L1(`Forestal Corte Alto · ${r.nombre} · Página ${p} de ${pags}`), W / 2, 292, { align: 'center' }); }
  const nombre = `Casas-Pensiones_${String(r.nombre).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-')}_${r.fecha}.pdf`;
  await compartirPDF(doc, nombre, `Revisión ${r.nombre} ${fmtF(r.fecha)}`);
}
