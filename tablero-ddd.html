<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tablero DdD">
<meta name="theme-color" content="#1a3a1a">
<title>Tablero DdD — Corte Alto</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1f0f;
  --bg2:#162516;
  --card:#1e321e;
  --card2:#243524;
  --border:#2e4a2e;
  --border2:#3a5e3a;
  --text:#e8f0e8;
  --text2:#a8c4a8;
  --text3:#6a8f6a;
  --green:#6fcf6f;
  --green-bg:#1a3a1a;
  --green-bright:#4caf50;
  --red:#e05555;
  --red-bg:#3a1010;
  --amber:#e0a030;
  --amber-bg:#3a2800;
  --white:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"SF Mono","Fira Mono","Consolas",monospace;
  --radius:10px;
  --radius-sm:6px;
}
html,body{height:100%;width:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden}

/* ── BARRA FILTROS ── */
#filtros{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
}
#filtros .logo{
  font-size:11px;font-weight:700;color:var(--green);
  text-transform:uppercase;letter-spacing:.1em;
  white-space:nowrap;margin-right:4px;
}
#filtros select,#filtros input[type=date]{
  font-size:12px;font-family:var(--font);
  padding:5px 8px;
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  background:var(--card);color:var(--text);
  outline:none;cursor:pointer;
  height:30px;
}
#filtros select:focus,#filtros input[type=date]:focus{border-color:var(--green)}
#filtros .sep{color:var(--text3);font-size:11px;padding:0 2px}
/* ── MULTI-SELECT FUNDO ── */
/* ── DROPDOWN FUNDO ── */
.fundo-wrap{position:relative;display:none}
.fundo-wrap.visible{display:block}
.btn-fundo-toggle{
  font-size:12px;font-family:var(--font);
  padding:5px 10px;height:30px;
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  background:var(--card);color:var(--text);cursor:pointer;
  white-space:nowrap;min-width:130px;text-align:left;
  display:flex;align-items:center;gap:4px;
}
.btn-fundo-toggle:hover{border-color:var(--green)}
.fundo-badge{
  font-size:10px;color:var(--white);font-weight:700;
  background:var(--green-bright);border-radius:8px;
  padding:1px 6px;margin-left:2px;
}
.fundo-menu{
  position:fixed;z-index:500;
  background:var(--card2);border:1px solid var(--border2);
  border-radius:var(--radius-sm);padding:6px 0;
  min-width:200px;max-height:220px;overflow-y:auto;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  display:none;
}
.fundo-menu.open{display:block}
.fundo-menu label{
  display:flex;align-items:center;gap:8px;
  padding:7px 14px;cursor:pointer;font-size:13px;color:var(--text);
  user-select:none;
}
.fundo-menu label:hover{background:var(--border)}
.fundo-menu input[type=checkbox]{
  accent-color:var(--green-bright);width:15px;height:15px;flex-shrink:0;
}
.btn-semana{  font-size:11px;font-weight:600;
  padding:5px 10px;height:30px;
  border:1px solid var(--border2);border-radius:var(--radius-sm);
  background:var(--card2);color:var(--text2);cursor:pointer;
  white-space:nowrap;
  transition:background .15s,color .15s;
}
.btn-semana:hover{background:var(--border2);color:var(--white)}
#btn-cargar{
  font-size:12px;font-weight:700;
  padding:5px 14px;height:30px;
  border:none;border-radius:var(--radius-sm);
  background:var(--green-bright);color:#fff;cursor:pointer;
  transition:opacity .15s;
  margin-left:auto;
}
#btn-cargar:hover{opacity:.85}
#btn-cargar:disabled{opacity:.4;cursor:default}

/* ── CONTENIDO PRINCIPAL ── */
#dashboard{width:100%;padding:10px 12px;display:flex;flex-direction:column;gap:10px}

/* ── ESTADO INICIAL ── */
#estado-vacio{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60vh;gap:12px;color:var(--text3);
}
#estado-vacio .icono{font-size:48px;opacity:.4}
#estado-vacio p{font-size:14px;text-align:center;max-width:280px;line-height:1.5}

/* ── SECCIÓN ENCABEZADO ── */
#bloque-header{
  display:flex;align-items:stretch;gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:10px 14px;
}
.header-info{flex:1;display:flex;align-items:center;gap:16px}
.header-logo{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.header-textos{flex:1}
.header-info .titulo{font-size:26px;font-weight:800;color:var(--white);line-height:1.1;letter-spacing:.01em}
.header-info .subtitulo{font-size:14px;color:var(--text3);margin-top:3px}
.header-info .periodo{font-size:13px;color:var(--green);font-weight:700;margin-top:5px;text-transform:uppercase;letter-spacing:.05em}

.seg-grid{display:flex;gap:6px}
.seg-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--border2);background:var(--card2);
  min-width:64px;
}
.seg-item.alerta{border-color:var(--red);background:var(--red-bg)}
.seg-item .seg-val{font-size:22px;font-weight:800;line-height:1;color:var(--white)}
.seg-item.alerta .seg-val{color:var(--red)}
.seg-item .seg-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-top:3px;text-align:center;line-height:1.2}
.seg-item.alerta .seg-lbl{color:var(--red)}

/* ── GRID PRINCIPAL (tabla full width) ── */
#grid-main{display:block;width:100%}

/* ── CARDS ── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;
}
.card-title{
  font-size:10px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.card-title::before{content:'';display:inline-block;width:3px;height:12px;border-radius:2px;background:currentColor}

/* ── BLOQUE PRODUCCIÓN ── */
#bloque-prod .card-title::before{background:var(--amber)}
#bloque-prod .card-title{color:var(--amber)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod-kpi{
  background:var(--card2);border-radius:var(--radius-sm);
  padding:10px 12px;border:1px solid var(--border2);
}
.prod-kpi.destacado{
  grid-column:1/-1;
  display:flex;align-items:center;justify-content:space-between;
  gap:12px;
}
.prod-kpi .kpi-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.prod-kpi .kpi-val{font-size:28px;font-weight:800;color:var(--white);line-height:1;font-family:var(--font-mono)}
.prod-kpi .kpi-val.grande{font-size:36px}
.prod-kpi .kpi-unit{font-size:11px;color:var(--text3);font-weight:400;margin-left:2px}
.prod-kpi .kpi-val.pos{color:var(--green)}
.prod-kpi .kpi-val.neg{color:var(--red)}
.barra-cumplimiento{height:6px;border-radius:3px;background:var(--border2);margin-top:8px;overflow:hidden}
.barra-cumplimiento .fill{height:100%;border-radius:3px;transition:width .4s}
.fill.pos{background:var(--green)}
.fill.neg{background:var(--red)}
.fill.ok{background:var(--amber)}

/* ── BLOQUE OEE ── */
#bloque-oee .card-title::before{background:var(--green)}
#bloque-oee .card-title{color:var(--green)}
.oee-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.oee-item{
  background:var(--card2);border-radius:var(--radius-sm);
  padding:8px;text-align:center;border:1px solid var(--border2);
}
.oee-item .o-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.oee-item .o-val{font-size:22px;font-weight:800;line-height:1.1;font-family:var(--font-mono)}
.oee-item .o-val.bueno{color:var(--green)}
.oee-item .o-val.malo{color:var(--red)}
.oee-item .o-val.medio{color:var(--amber)}
.oee-tpob{display:flex;gap:6px;margin-bottom:10px}
.tpob-pill{
  flex:1;background:var(--card2);border-radius:var(--radius-sm);
  padding:7px 10px;border:1px solid var(--border2);
  display:flex;flex-direction:column;align-items:center;
}
.tpob-pill .t-lbl{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.tpob-pill .t-val{font-size:18px;font-weight:700;color:var(--amber);font-family:var(--font-mono)}

/* tabla causales */
.tabla-causales{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.tabla-causales th{
  font-size:9px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.06em;padding:4px 6px;text-align:left;
  border-bottom:1px solid var(--border2);
}
.tabla-causales td{padding:4px 6px;border-bottom:1px solid var(--border);color:var(--text2)}
.tabla-causales td:last-child{text-align:right;font-family:var(--font-mono);font-weight:600;color:var(--amber)}
.tabla-causales tr:last-child td{border-bottom:none}

/* tabla aprovechamiento */
.tabla-aprov{width:100%;border-collapse:collapse;font-size:11px}
.tabla-aprov th{
  font-size:9px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.06em;padding:4px 6px;text-align:right;
  border-bottom:1px solid var(--border2);
}
.tabla-aprov th:first-child{text-align:left}
.tabla-aprov td{padding:4px 6px;border-bottom:1px solid var(--border);font-family:var(--font-mono);text-align:right;font-size:12px}
.tabla-aprov td:first-child{text-align:left;color:var(--text2);font-family:var(--font);font-size:11px}
.tabla-aprov tr:last-child td{border-bottom:none}
.tag-sobre{color:var(--green);font-weight:700}
.tag-bajo{color:var(--red);font-weight:700}

/* ── BLOQUE BODEGA ── */
#bloque-bodega .card-title::before{background:#6ab0f0}
#bloque-bodega .card-title{color:#6ab0f0}
.bodega-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bodega-item{
  background:var(--card2);border-radius:var(--radius-sm);
  padding:8px 10px;border:1px solid var(--border2);
  display:flex;flex-direction:column;gap:4px;
}
.bodega-item label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.bodega-item input{
  font-size:24px;font-weight:800;font-family:var(--font-mono);
  color:var(--white);background:transparent;border:none;outline:none;
  width:100%;padding:0;
  border-bottom:1px solid var(--border2);
}
.bodega-item input::placeholder{color:var(--border2);font-size:20px}
.bodega-unit{font-size:10px;color:var(--text3)}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--card2);border:1px solid var(--border2);color:var(--text);
  padding:8px 18px;border-radius:20px;font-size:13px;
  transition:transform .25s;z-index:999;pointer-events:none;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── SPINNER ── */
#spinner{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  align-items:center;justify-content:center;z-index:500;
}
#spinner.on{display:flex}
.spin-ring{
  width:40px;height:40px;border-radius:50%;
  border:3px solid var(--border2);border-top-color:var(--green-bright);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SECCIÓN TÍTULO interno ── */
.sec-sep{
  font-size:9px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.08em;margin:8px 0 4px;padding-bottom:4px;
  border-bottom:1px solid var(--border);
}

/* ── RESPONSIVE MÓVIL ── */
@media(max-width:700px){
  #grid-main{grid-template-columns:1fr}
  .prod-grid{grid-template-columns:1fr 1fr}
  .oee-grid{grid-template-columns:1fr 1fr 1fr}
  .bodega-grid{grid-template-columns:1fr}
  #filtros{gap:6px}
  .seg-grid{flex-wrap:wrap}
}/* ==== TABLA ESTILO EXCEL (rediseño v2, más clara, tamaño reunión) ==== */
/* ── TABLA EXCEL WRAP ── */
.tabla-ddd-wrap{
  width:100%;
  overflow-x:auto;
  overflow-y:auto;
  border-radius:10px;
  border:1px solid #b7c9a8;
  max-height:calc(100vh - 120px);
  -webkit-overflow-scrolling:touch;
}
table.tabla-ddd{
  border-collapse:collapse;
  width:100%;
  min-width:600px;
  font-size:16px;
  white-space:nowrap;
  background:#fff;
  color:#1a1a1a;
  table-layout:auto;
}
table.tabla-ddd th,table.tabla-ddd td{border:1px solid #cfd8c2;padding:9px 14px;text-align:center}
table.tabla-ddd thead th{background:#ffe066;color:#1a1a1a;position:sticky;top:0;z-index:3;font-size:15px}
table.tabla-ddd td.lbl,table.tabla-ddd th.lbl{
  text-align:left;
  background:#eef3e6;z-index:1;
  min-width:200px;max-width:320px;
  font-weight:600;color:#1a1a1a;
  white-space:normal;word-break:break-word;
}
table.tabla-ddd th.lbl{z-index:4;position:sticky;top:0}
table.tabla-ddd tr.seccion td{
  background:#c9dfae;font-weight:700;text-transform:uppercase;
  font-size:13px;letter-spacing:.04em;text-align:left;
  position:sticky;left:0;white-space:normal;
}
table.tabla-ddd td.resumen,table.tabla-ddd th.resumen{background:#e3edd3;font-weight:700}
table.tabla-ddd td.azul{color:#1560c4;font-weight:700}
table.tabla-ddd td.rojo{color:#c0392b;font-weight:700}
table.tabla-ddd tr.rodal-a td.lbl{background:#d7e8c4}
table.tabla-ddd tr.rodal-b td.lbl{background:#c3ddb0}
/* ── COLUMNA GRUPO LATERAL ── */
table.tabla-ddd td.grupo{
  writing-mode:vertical-rl;transform:rotate(180deg);
  text-align:center;vertical-align:middle;
  font-weight:800;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  white-space:nowrap;padding:8px 5px;border:1px solid #b7c9a8;
  min-width:28px;max-width:34px;
}
table.tabla-ddd td.grupo.g-seg   {background:#3d6b20;color:#ffe066}
table.tabla-ddd td.grupo.g-prod  {background:#4a7a28;color:#ffe066}
table.tabla-ddd td.grupo.g-proc  {background:#2d5c18;color:#ffe066}
table.tabla-ddd td.grupo.g-sub   {background:#b0cc90;color:#2d5c18;font-size:10px;font-weight:700}
table.tabla-ddd td.grupo.g-aprov {background:#5a8a30;color:#ffe066}
table.tabla-ddd td.grupo.g-bod   {background:#7a6a1a;color:#ffe066}
table.tabla-ddd td.lbl-sub{
  text-align:left;background:#eef3e6;
  min-width:220px;max-width:320px;
  font-weight:400;color:#1a1a1a;
  white-space:normal;word-break:break-word;
  padding-left:20px;font-size:14px;
}
/* Meta entre paréntesis */
span.meta-lbl{font-size:12px;color:#2d6a10;font-weight:700;margin-left:3px}
/* Divisor entre bloques principales */
table.tabla-ddd tr.div-bloque td{
  border-top:3px solid #3d6b20 !important;
  padding:0 !important;
  height:0 !important;
  line-height:0 !important;
  font-size:0 !important;
}

/* ── ORIENTACIÓN LANDSCAPE FORZADA EN MÓVIL ── */
@media screen and (max-width:768px) and (orientation:portrait){
  #aviso-rotar{
    display:flex;
    position:fixed;inset:0;z-index:9999;
    background:#0f1f0f;
    flex-direction:column;
    align-items:center;justify-content:center;
    gap:16px;color:#e8f0e8;text-align:center;padding:24px;
  }
  #aviso-rotar .icono-rotar{font-size:52px;animation:rotar-anim 1.5s ease-in-out infinite alternate}
  #aviso-rotar p{font-size:15px;color:#a8c4a8;max-width:260px;line-height:1.5}
  @keyframes rotar-anim{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}
}
@media screen and (max-width:768px) and (orientation:landscape){
  #aviso-rotar{display:none}
  .tabla-ddd-wrap{
    max-height:calc(100vh - 80px);
    border-radius:6px;
  }
  table.tabla-ddd{font-size:13px}
  table.tabla-ddd th,table.tabla-ddd td{padding:6px 10px}
  table.tabla-ddd td.lbl,table.tabla-ddd th.lbl{min-width:160px;max-width:220px;font-size:12px}
  table.tabla-ddd thead th{font-size:12px}
  #filtros{padding:5px 8px;gap:5px}
  #filtros select,#filtros input[type=date]{font-size:11px;height:26px;padding:3px 6px}
  #btn-cargar{font-size:11px;height:26px;padding:3px 10px}
  #bloque-header{padding:6px 10px}
  .header-info .titulo{font-size:18px}
  .header-logo{width:36px;height:36px}
}
</style>
</head>
<body>

<!-- AVISO ROTAR (solo portrait móvil) -->
<div id="aviso-rotar" style="display:none">
  <div class="icono-rotar">📱</div>
  <p>Girá el celular a <strong>horizontal</strong> para ver el tablero completo</p>
</div>

<!-- BARRA FILTROS -->
<div id="filtros">
  <span class="logo">📊 DdD</span>

  <select id="sel-linea" onchange="onLineaChange()">
    <option value="">Línea…</option>
  </select>

  <div class="fundo-wrap" id="fundo-wrap">
    <button class="btn-fundo-toggle" id="btn-fundo-toggle" onclick="toggleFundoMenu(event)" type="button">
      <span id="fundo-label">Fundo…</span>
      <span id="fundo-badge" class="fundo-badge" style="display:none"></span>
      <span>▾</span>
    </button>
    <div class="fundo-menu" id="fundo-menu"></div>
  </div>

  <!-- Equipos madereo (opcional) -->
  <div class="fundo-wrap" id="madereo-wrap" style="display:none">
    <button class="btn-fundo-toggle" id="btn-madereo-toggle" onclick="toggleMadereoMenu(event)" type="button">
      <span id="madereo-label">Eq. Madereo…</span>
      <span id="madereo-badge" class="fundo-badge" style="display:none"></span>
      <span>▾</span>
    </button>
    <div class="fundo-menu" id="madereo-menu"></div>
  </div>

  <select id="sel-procesador">
    <option value="">Procesador…</option>
  </select>

  <span class="sep">Desde</span>
  <input type="date" id="fecha-desde">
  <span class="sep">hasta</span>
  <input type="date" id="fecha-hasta">

  <button id="btn-cargar" onclick="cargarDatos()">Cargar ▶</button>
</div>

<!-- SPINNER -->
<div id="spinner"><div class="spin-ring"></div></div>

<!-- DASHBOARD -->
<div id="dashboard">

  <!-- ESTADO VACÍO -->
  <div id="estado-vacio">
    <div class="icono">🌲</div>
    <p>Selecciona línea, procesador y rango de fechas, luego presiona <strong>Cargar</strong>.</p>
  </div>

  <!-- HEADER DESTACADO -->

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs, query, where, orderBy, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCAK6CdwawIyo4IjsJedNx_KkR_4ROqN4",
  authDomain: "reporte-inicio-faena-forestal.firebaseapp.com",
  projectId: "reporte-inicio-faena-forestal",
  storageBucket: "reporte-inicio-faena-forestal.firebasestorage.app",
  messagingSenderId: "962534414054",
  appId: "1:962534414054:web:fa43371d31413fc0524d27"
};
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Colecciones ──
const COL_PROD     = "reportes_produccion";
const COL_JEFE     = "productividad_jefe";
const COL_META     = "config_volumen_meta";
const COL_LINEAS   = "config_lineas";
const COL_EQUIPOS  = "config_equipos";
const COL_FUNDOS   = "config_fundos";

// ── Estado ──
let lineas        = [];
let equipos       = [];
let fundos        = [];
// Lista fija de equipos de madereo — igual que produccion-diaria.html
const equiposMadereo = ['ALPINE-1','ALPINE-2','ALPINE-3','SK625N1','SK625N2','SK625N3','SK635E']
  .map(n=>({nombre:n}));
// ── Utils ──
function fmt(n,dec=0){if(n==null||isNaN(n))return '—';return Number(n).toLocaleString('es-CL',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function pct(n){if(n==null||isNaN(n))return '—';return fmt(n*100,1)+'%';}
function toast(msg,ms=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}
function spin(on){document.getElementById('spinner').classList.toggle('on',on);}
function $id(id){return document.getElementById(id);}
function colorOEE(val){if(val>=0.65)return 'bueno';if(val>=0.45)return 'medio';return 'malo';}

function idMeta(linea,mes,anio){
  const mesStr=String(mes).padStart(2,'0');
  return `${linea}_${anio}-${mesStr}`;
}

function rangoFechas(desde,hasta){
  const dias=[];let d=new Date(desde+'T00:00:00');const h=new Date(hasta+'T00:00:00');
  while(d<=h){dias.push(d.toISOString().split('T')[0]);d=new Date(d.getTime()+86400000);}
  return dias;
}

// ── Semana lunes→domingo ──
function calcSemana(offsetSemanas){
  const hoy=new Date();
  const dow=hoy.getDay();
  const diffLun=dow===0?-6:1-dow;
  const lun=new Date(hoy);lun.setDate(hoy.getDate()+diffLun+offsetSemanas*7);
  const dom=new Date(lun);dom.setDate(lun.getDate()+6);
  return[lun.toISOString().split('T')[0],dom.toISOString().split('T')[0]];
}
window.setSemana=function(offset){
  const[d,h]=calcSemana(offset);
  $id('fecha-desde').value=d;$id('fecha-hasta').value=h;
};

// ── Cargar listas al inicio ──
async function init(){
  // Líneas
  try{
    const snap=await getDocs(query(collection(db,COL_LINEAS),orderBy('nombre')));
    lineas=snap.docs.map(d=>({id:d.id,...d.data()}));
    const sel=$id('sel-linea');
    lineas.forEach(l=>{const o=document.createElement('option');o.value=l.nombre;o.textContent=l.nombre;sel.appendChild(o);});
  }catch(e){toast('Sin conexión — no se cargaron líneas');}

  // Equipos procesadores
  try{
    const snap=await getDocs(query(collection(db,COL_EQUIPOS),orderBy('nombre')));
    equipos=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){}

  // Fundos
  try{
    const snap=await getDocs(query(collection(db,COL_FUNDOS),orderBy('nombre')));
    fundos=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!fundos.length){
      // Fallback: cargar fundos únicos desde reportes_produccion
      const snapR=await getDocs(query(collection(db,COL_PROD),orderBy('fundo')));
      const nombresSet=new Set(snapR.docs.map(d=>d.data().fundo).filter(Boolean));
      fundos=[...nombresSet].sort().map(n=>({nombre:n}));
    }
  }catch(e){
    toast('⚠️ No se pudieron cargar los fundos');
  }

  // Fecha por defecto: esta semana
  setSemana(0);
}

window.onLineaChange=function(){
  const linea=$id('sel-linea').value;
  // Reset procesador
  const selProc=$id('sel-procesador');
  selProc.innerHTML='<option value="">Procesador…</option>';
  // Reset fundo
  const menu=$id('fundo-menu');
  menu.innerHTML='';
  menu.classList.remove('open');
  $id('fundo-label').textContent='Fundo…';
  $id('fundo-badge').style.display='none';
  $id('fundo-wrap').classList.remove('visible');
  // Reset madereo
  const menuM=$id('madereo-menu');
  menuM.innerHTML='';
  menuM.classList.remove('open');
  $id('madereo-label').textContent='Eq. Madereo…';
  $id('madereo-badge').style.display='none';
  $id('madereo-wrap').style.display='none';
  if(!linea)return;
  // Poblar procesadores
  equipos
    .filter(e=>e.tipo==='PROCESADOR')
    .forEach(e=>{const o=document.createElement('option');o.value=e.nombre;o.textContent=e.nombre;selProc.appendChild(o);});
  // Poblar fundos
  fundos.forEach(f=>{
    const lbl=document.createElement('label');
    const chk=document.createElement('input');
    chk.type='checkbox';chk.value=f.nombre;
    chk.addEventListener('change',actualizarBadgeFundo);
    lbl.appendChild(chk);
    lbl.appendChild(document.createTextNode(' '+f.nombre));
    menu.appendChild(lbl);
  });
  $id('fundo-wrap').classList.add('visible');
  // Poblar equipos madereo
  if(equiposMadereo.length){
    equiposMadereo.forEach(e=>{
      const lbl=document.createElement('label');
      const chk=document.createElement('input');
      chk.type='checkbox';chk.value=e.nombre;
      chk.addEventListener('change',actualizarBadgeMadereo);
      lbl.appendChild(chk);
      lbl.appendChild(document.createTextNode(' '+e.nombre));
      menuM.appendChild(lbl);
    });
    $id('madereo-wrap').style.display='block';
  }
};

window.toggleFundoMenu=function(e){
  e.stopPropagation();
  const menu=$id('fundo-menu');
  const btn=$id('btn-fundo-toggle');
  const rect=btn.getBoundingClientRect();
  if(menu.classList.contains('open')){
    menu.classList.remove('open');return;
  }
  // Posicionar el menú justo bajo el botón
  menu.style.top=(rect.bottom+4)+'px';
  menu.style.left=rect.left+'px';
  menu.style.minWidth=rect.width+'px';
  menu.classList.add('open');
};

// Cerrar al hacer click fuera
document.addEventListener('click',function(){
  $id('fundo-menu').classList.remove('open');
  $id('madereo-menu').classList.remove('open');
});

function actualizarBadgeFundo(){
  const sel=fundosSeleccionados();
  const badge=$id('fundo-badge');
  const lbl=$id('fundo-label');
  if(sel.length===0){lbl.textContent='Fundo…';badge.style.display='none';}
  else if(sel.length===1){lbl.textContent=sel[0];badge.style.display='none';}
  else{lbl.textContent='Fundos';badge.textContent=sel.length;badge.style.display='';}
}

function fundosSeleccionados(){
  return [...$id('fundo-menu').querySelectorAll('input[type=checkbox]:checked')]
    .map(c=>c.value);
}

window.toggleMadereoMenu=function(e){
  e.stopPropagation();
  const menu=$id('madereo-menu');
  const btn=$id('btn-madereo-toggle');
  const rect=btn.getBoundingClientRect();
  if(menu.classList.contains('open')){menu.classList.remove('open');return;}
  menu.style.top=(rect.bottom+4)+'px';
  menu.style.left=rect.left+'px';
  menu.style.minWidth=rect.width+'px';
  menu.classList.add('open');
};

function actualizarBadgeMadereo(){
  const sel=madereoSeleccionados();
  const badge=$id('madereo-badge');
  const lbl=$id('madereo-label');
  if(sel.length===0){lbl.textContent='Eq. Madereo…';badge.style.display='none';}
  else if(sel.length===1){lbl.textContent=sel[0];badge.style.display='none';}
  else{lbl.textContent='Madereo';badge.textContent=sel.length;badge.style.display='';}
}

function madereoSeleccionados(){
  return [...$id('madereo-menu').querySelectorAll('input[type=checkbox]:checked')]
    .map(c=>c.value);
}

// ── CARGA PRINCIPAL ──
window.cargarDatos=async function(){
  const linea=$id('sel-linea').value;
  const procesador=$id('sel-procesador').value;
  const desde=$id('fecha-desde').value;
  const hasta=$id('fecha-hasta').value;
  const fundosSel=fundosSeleccionados();

  if(!linea){toast('Selecciona una línea');return;}
  if(!fundosSel.length){toast('Selecciona al menos un fundo');return;}
  if(!desde||!hasta){toast('Elige el rango de fechas');return;}
  if(desde>hasta){toast('La fecha "desde" debe ser anterior a "hasta"');return;}

  spin(true);$id('btn-cargar').disabled=true;

  try{
    const dias=rangoFechas(desde,hasta);

    // ── 1. Producción diaria ──
    const madSel=madereoSeleccionados();
    // Si hay equipos madereo seleccionados, buscar en todas las líneas del fundo
    // porque equipos prestados pueden reportar bajo otra línea
    const snapProd=await getDocs(query(
      collection(db,COL_PROD),
      where('fecha','>=',desde),
      where('fecha','<=',hasta),
      ...(madSel.length ? [] : [where('linea','==',linea)])
    ));
    const docsProd=snapProd.docs.map(d=>d.data())
      .filter(d=>fundosSel.includes(d.fundo));

    // Volumen real por día — si hay equipos madereo seleccionados, sumar solo sus cartolas
    const volRealPorDia={};
    docsProd.forEach(d=>{
      let vol=0;
      if(madSel.length){
        // Sumar solo cartolas de los equipos seleccionados
        (d.cartolas||[]).forEach(c=>{
          if(madSel.includes(c.equipo)) vol+=(c.total||0);
        });
      }else{
        vol=d.totalGlobal||0;
      }
      if(vol>0) volRealPorDia[d.fecha]=(volRealPorDia[d.fecha]||0)+vol;
    });

    // Aprovechamiento por rodal (etRodales) — indexado por fecha para mostrar columnas diarias
    const rodalMap={};
    docsProd.forEach(d=>{
      const fecha=d.fecha;
      (d.etRodales||[]).forEach(r=>{
        if(!r.numero)return;
        if(!rodalMap[r.numero])rodalMap[r.numero]={};
        // Guardar el valor de ese rodal para esa fecha exacta
        rodalMap[r.numero][fecha]={
          clear:   r.clear   !=null?r.clear   :null,
          industrial:r.industrial!=null?r.industrial:null,
          pulpa:   r.pulpa   !=null?r.pulpa   :null,
          siniestrado:r.siniestrado!=null?r.siniestrado:null
        };
      });
    });

    // ── 2. Productividad jefe (seguridad + OEE) — por día ──
    const snapJefe=await getDocs(query(
      collection(db,COL_JEFE),
      where('fecha','>=',desde),
      where('fecha','<=',hasta),
      where('linea','==',linea)
    ));
    // Filtrar por fundo(s) seleccionados en cliente
    const docsJefe=snapJefe.docs.map(d=>d.data())
      .filter(d=>fundosSel.includes(d.fundo));

    const segPorDia={};
    const oeePorDia={},fdPorDia={},fePorDia={},tobPorDia={},tocPorDia={},tpPorDia={};
    const causalesPorDia={}; // { motivo: { fecha: horas } }

    docsJefe.forEach(d=>{
      const f=d.fecha;
      const s=d.seguridad||{};
      segPorDia[f]=segPorDia[f]||{accidenteCTP:0,accidenteSTP:0,cuasiAccidente:0,incidenteMedioAmb:0};
      segPorDia[f].accidenteCTP+=(s.accidenteCTP||0);
      segPorDia[f].accidenteSTP+=(s.accidenteSTP||0);
      segPorDia[f].cuasiAccidente+=(s.cuasiAccidente||0);
      segPorDia[f].incidenteMedioAmb+=(s.incidenteMedioAmb||0);

      (d.equipos||[]).forEach(eq=>{
        if(procesador && eq.equipo!==procesador)return;
        if(eq.tipo!=='PROCESADOR')return;
        if(eq.reportaOEE !== true)return;
        if(eq.fd!=null){fdPorDia[f]=fdPorDia[f]||[];fdPorDia[f].push(eq.fd);}
        if(eq.fe!=null){fePorDia[f]=fePorDia[f]||[];fePorDia[f].push(eq.fe);}
        if(eq.oee!=null){oeePorDia[f]=oeePorDia[f]||[];oeePorDia[f].push(eq.oee);}
        if(eq.tob!=null){tobPorDia[f]=(tobPorDia[f]||0)+eq.tob;}
        if(eq.toc!=null){tocPorDia[f]=(tocPorDia[f]||0)+eq.toc;}
        const tpVal=eq.tp??eq.tpProgramado??null;
        if(tpVal!=null){tpPorDia[f]=(tpPorDia[f]||0)+tpVal;}
        (eq.detenciones||[]).forEach(det=>{
          const k=det.motivo||'(sin motivo)';
          causalesPorDia[k]=causalesPorDia[k]||{};
          causalesPorDia[k][f]=(causalesPorDia[k][f]||0)+(det.horas||0);
        });
      });
    });
    const avg=arr=>(arr&&arr.length)?arr.reduce((a,b)=>a+b,0)/arr.length:null;

    // ── 3. Meta diaria (config_volumen_meta) — por día ──
    const mesesSet={};
    dias.forEach(f=>{
      const [y,m,d]=f.split('-');
      const k=`${y}-${m}`;if(!mesesSet[k])mesesSet[k]={anio:+y,mes:+m};
    });
    const metaPorDia={};
    for(const k of Object.keys(mesesSet)){
      const{anio,mes}=mesesSet[k];
      const idDoc=idMeta(linea,mes,anio);
      try{
        const snap=await getDoc(doc(db,COL_META,idDoc));
        if(snap.exists()){
          const vals=snap.data().valores||[];
          vals.forEach((v,i)=>{
            const dia=i+1;
            const fStr=`${anio}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
            if(dias.includes(fStr) && v!=null && !isNaN(v)) metaPorDia[fStr]=Number(v);
          });
        }
      }catch(e){}
    }

    // ── 4. Fundos únicos del período ──
    const fundosSet=new Set(docsProd.map(d=>d.fundo).filter(Boolean));
    const fundoStr=fundosSel.join(', ')||'—';

    // ── 5. Stock de bodega: preguntar al usuario ──
    const stock=pedirStockBodega();
    if(!stock){ // canceló
      spin(false);$id('btn-cargar').disabled=false;
      return;
    }

    // ── RENDER ──
    renderHeader(linea,fundoStr,desde,hasta);
    renderTablaDdd({
      dias,procesador,
      segPorDia,volRealPorDia,metaPorDia,
      oeePorDia,fdPorDia,fePorDia,tobPorDia,tocPorDia,tpPorDia,
      causalesPorDia,rodalMap,stock
    });

    // Mostrar bloques
    $id('estado-vacio').style.display='none';
    $id('bloque-header').style.display='';
    $id('grid-main').style.display='';

    toast(`✅ ${dias.length} días cargados`);

  }catch(e){
    console.error(e);
    toast('⚠️ Error al cargar datos: '+e.message,4000);
  }finally{
    spin(false);$id('btn-cargar').disabled=false;
  }
};

function pedirStockBodega(){
  const aserrable=prompt('Stock de cierre — Madera Aserrable (cargas):','0');
  if(aserrable===null)return null;
  const pulpable=prompt('Stock de cierre — Madera Pulpable (cargas):','0');
  if(pulpable===null)return null;
  const manchada=prompt('Stock de cierre — Madera Manchada (cargas):','0');
  if(manchada===null)return null;
  return{
    aserrable:Number(aserrable)||0,
    pulpable:Number(pulpable)||0,
    manchada:Number(manchada)||0
  };
}

function renderHeader(linea,fundo,desde,hasta){
  $id('hdr-titulo').textContent=`Línea ${linea}`;
  $id('hdr-fundo').textContent=fundo;
  const fmt2=f=>f.split('-').reverse().join('/');
  $id('hdr-periodo').textContent=`${fmt2(desde)} — ${fmt2(hasta)}`;
}

function fmtDiaCorto(f){
  const [,, d]=f.split('-');
  return String(Number(d));
}

function claseAlertaVsMeta(dif,pct){
  if(pct==null)return '';
  if(pct>=0.98&&pct<=1.02)return 'alerta-verde';
  return dif>=0?'alerta-verde':'alerta-rojo';
}

function renderTablaDdd(ctx){
  const{dias,procesador,segPorDia,volRealPorDia,metaPorDia,
        oeePorDia,fdPorDia,fePorDia,tobPorDia,tocPorDia,tpPorDia,
        causalesPorDia,rodalMap,stock}=ctx;

  const avg=arr=>(arr&&arr.length)?arr.filter(v=>v!=null).reduce((a,b)=>a+b,0)/arr.filter(v=>v!=null).length:null;
  const sumObj=obj=>Object.values(obj).reduce((a,b)=>a+(b||0),0);
  const nd=dias.length; // cantidad de días del rango

  // ── Encabezado ──
  const diasCortos=dias.map(fmtDiaCorto);
  const rangoLabel=`${fmtDiaCorto(dias[0])} al ${fmtDiaCorto(dias[dias.length-1])}`;
  // 3 columnas fijas: grupo | subgrupo | KPI
  $id('thead-ddd').innerHTML=`<tr>
    <th class="lbl" style="min-width:28px;max-width:34px"></th>
    <th class="lbl" style="min-width:28px;max-width:34px"></th>
    <th class="lbl">KPI</th>
    ${diasCortos.map(d=>`<th>${d}</th>`).join('')}
    <th class="resumen">${rangoLabel}</th>
  </tr>`;

  // Helper: celda vacía de grupo (cuando la fila no es la primera del grupo)
  const GV=''; // sin celda — manejado con rowspan
  const claseMeta=metaPct=>v=>{ if(v==null)return ''; return v>=metaPct?'azul':'rojo'; };
  const filas=[];

  // ─────────────────────────────────────────────
  // BLOQUE SEGURIDAD (4 filas)
  // ─────────────────────────────────────────────
  const segCampos=[
    ['accidenteCTP','Accidentes CTP'],
    ['accidenteSTP','Accidentes STP'],
    ['cuasiAccidente','Casi Accidentes'],
    ['incidenteMedioAmb','Incidentes Medio Ambientales']
  ];
  segCampos.forEach(([campo,lbl],i)=>{
    const vals=dias.map(f=>(segPorDia[f]||{})[campo]??0);
    const total=vals.reduce((a,b)=>a+b,0);
    const celdas=vals.map(v=>{const c=v>0?'rojo':'';return `<td class="${c}">${fmt(v,0)}</td>`;}).join('');
    const totalCls=total>0?'rojo':'';
    const grupoCell=i===0?`<td class="grupo g-seg" rowspan="${segCampos.length}">Seguridad y Med. Ambiente</td>`:'';
    const subCell=i===0?`<td class="grupo g-sub" rowspan="${segCampos.length}">Seguridad</td>`:'';
    filas.push(`<tr>${grupoCell}${subCell}<td class="lbl">${lbl}</td>${celdas}<td class="resumen ${totalCls}">${fmt(total,0)}</td></tr>`);
  });

  // ─────────────────────────────────────────────
  // BLOQUE PRODUCCIÓN (4 filas)
  // ─────────────────────────────────────────────
  const volRealVals=dias.map(f=>volRealPorDia[f]??null);
  const volMetaVals=dias.map(f=>metaPorDia[f]??null);
  const volRealTot=volRealVals.reduce((a,b)=>a+(b||0),0);
  const volMetaTot=volMetaVals.reduce((a,b)=>a+(b||0),0);
  const cumplVals=dias.map((f,i)=>{const m=volMetaVals[i],r=volRealVals[i];return(m&&m>0)?(r||0)/m*100:null;});
  const cumplTot=(volMetaTot>0)?(volRealTot/volMetaTot*100):null;
  const difVals=dias.map((f,i)=>volMetaVals[i]!=null?(volRealVals[i]||0)-volMetaVals[i]:null);
  const difTot=(volMetaTot>0)?volRealTot-volMetaTot:null;
  const prodFilas=[
    {lbl:'Cumplimiento de programa (%)', vals:cumplVals, total:cumplTot,
      fn:v=>v==null?'':(v>=98?'azul':'rojo'), dec:0, suf:'%'},
    {lbl:'Volumen según oferta (m³)',    vals:volMetaVals, total:volMetaTot||null, fn:null, dec:0},
    {lbl:'Volumen real (m³)',            vals:volRealVals, total:volRealTot,       fn:null, dec:0},
    {lbl:'Diferencia m³ Meta vs Real',   vals:difVals,     total:difTot,
      fn:v=>v==null?'':(v>=0?'azul':'rojo'), dec:0}
  ];
  // Divisor antes de Producción
  filas.push(`<tr class="div-bloque"><td colspan="${3+dias.length+1}"></td></tr>`);
  prodFilas.forEach(({lbl,vals,total,fn,dec,suf},i)=>{
    const s=suf||'';
    const celdas=vals.map(v=>{const c=fn?fn(v):'';return `<td class="${c}">${v!=null?fmt(v,dec)+s:'—'}</td>`;}).join('');
    const tc=fn?fn(total):'';
    const grupoCell=i===0?`<td class="grupo g-prod" rowspan="${prodFilas.length}">Producción</td>`:'';
    const subCell=i===0?`<td class="grupo g-sub" rowspan="${prodFilas.length}">Programa</td>`:'';
    filas.push(`<tr>${grupoCell}${subCell}<td class="lbl">${lbl}</td>${celdas}<td class="resumen ${tc}">${total!=null?fmt(total,dec)+s:'—'}</td></tr>`);
  });

  // ─────────────────────────────────────────────
  // BLOQUE PROCESADOR
  // ─────────────────────────────────────────────
  const oeeVals=dias.map(f=>avg(oeePorDia[f]||[]));
  const fdVals= dias.map(f=>avg(fdPorDia[f]||[]));
  const feVals= dias.map(f=>avg(fePorDia[f]||[]));
  const oeeTodos=Object.values(oeePorDia).flat().filter(v=>v!=null);
  const fdTodos= Object.values(fdPorDia).flat().filter(v=>v!=null);
  const feTodos= Object.values(fePorDia).flat().filter(v=>v!=null);
  const tobVals=dias.map(f=>tobPorDia[f]??null);
  const tocVals=dias.map(f=>tocPorDia[f]??null);
  const tpVals= dias.map(f=>tpPorDia[f]??null);
  const tobTot=tobVals.reduce((a,b)=>a+(b||0),0);
  const tocTot=tocVals.reduce((a,b)=>a+(b||0),0);
  const tpTot= tpVals.reduce((a,b)=>a+(b||0),0);
  const metaTOB_periodo=2.75*nd; // meta proporcional al rango

  // Causales Top 10
  const motivosTotal=Object.keys(causalesPorDia).map(m=>[m,sumObj(causalesPorDia[m])]);
  motivosTotal.sort((a,b)=>b[1]-a[1]);
  const motivos=motivosTotal.slice(0,10).map(([m])=>m);

  // Total filas del bloque procesador = 5 indicadores + causales
  const nIndicadores=6;
  const nCausales=Math.max(motivos.length,1);
  const nProc=nIndicadores+nCausales;

  const procNombre=procesador||'Procesador';

  // Indicadores (5 filas)
  const indicFilas=[
    {lbl:'OEE (%) <span class="meta-lbl">(meta 66%)</span>',                      vals:oeeVals.map(v=>v!=null?v*100:null), total:avg(oeeTodos)!=null?avg(oeeTodos)*100:null, fn:claseMeta(66), dec:0, suf:'%'},
    {lbl:'Factor de Disponibilidad (FD) <span class="meta-lbl">(meta 75%)</span>',vals:fdVals.map(v=>v!=null?v*100:null),  total:avg(fdTodos)!=null?avg(fdTodos)*100:null,   fn:claseMeta(75), dec:0, suf:'%'},
    {lbl:'Factor de Eficiencia (FE) <span class="meta-lbl">(meta 88%)</span>',    vals:feVals.map(v=>v!=null?v*100:null),  total:avg(feTodos)!=null?avg(feTodos)*100:null,   fn:claseMeta(88), dec:0, suf:'%'},
    {lbl:'TPOB (Horas) <span class="meta-lbl">(meta 2,75 h/día)</span>',          vals:tobVals, total:tobTot,
      fn:v=>v==null?'':(v<=2.75?'azul':'rojo'),
      fnTotal:t=>t<=metaTOB_periodo?'azul':'rojo',
      dec:2},
    {lbl:'TPOC (Horas)',                 vals:tocVals, total:tocTot, fn:null, dec:2},
    {lbl:'TP (Horas)',                   vals:tpVals,  total:tpTot,  fn:null, dec:2}
  ];

  // Divisor antes de Procesador
  filas.push(`<tr class="div-bloque"><td colspan="${3+dias.length+1}"></td></tr>`);
  indicFilas.forEach(({lbl,vals,total,fn,fnTotal,dec,suf},i)=>{
    const s=suf||'';
    const celdas=vals.map(v=>{const c=fn?fn(v):'';return `<td class="${c}">${v!=null?fmt(v,dec)+s:'—'}</td>`;}).join('');
    const tc=fnTotal?fnTotal(total):(fn?fn(total):'');
    const grupoCell=i===0?`<td class="grupo g-proc" rowspan="${nProc}">${procNombre}</td>`:'';
    const subCell=i===0?`<td class="grupo g-sub" rowspan="${nIndicadores}">Indicadores</td>`:'';
    filas.push(`<tr>${grupoCell}${subCell}<td class="lbl">${lbl}</td>${celdas}<td class="resumen ${tc}">${total!=null?fmt(total,dec)+s:'—'}</td></tr>`);
  });

  // Causales (filas variables, subgrupo con rowspan)
  if(motivos.length===0){
    filas.push(`<tr><td class="grupo g-sub">T. Perdidos Obvios</td><td class="lbl">Sin causales registradas</td>${dias.map(()=>'<td>—</td>').join('')}<td class="resumen">—</td></tr>`);
  }else{
    motivos.forEach((m,i)=>{
      const vals=dias.map(f=>causalesPorDia[m][f]??null);
      const total=vals.reduce((a,b)=>a+(b||0),0);
      const celdas=vals.map(v=>`<td>${v!=null?fmt(v,2):'—'}</td>`).join('');
      const subCell=i===0?`<td class="grupo g-sub" rowspan="${nCausales}">T. Perdidos Obvios</td>`:'';
      filas.push(`<tr>${subCell}<td class="lbl">${m}</td>${celdas}<td class="resumen">${fmt(total,2)}</td></tr>`);
    });
  }

  // ─────────────────────────────────────────────
  // BLOQUE APROVECHAMIENTO
  // ─────────────────────────────────────────────
  const rodales=Object.keys(rodalMap);
  const tiposAprov=[['Clear','clear'],['Industrial','industrial'],['Pulpa','pulpa'],['Siniestrado','siniestrado']];
  const nAprov=rodales.length===0?1:rodales.length*(1+tiposAprov.length); // fila cabecera rodal + 4 tipos

  // Divisor antes de Aprovechamiento
  filas.push(`<tr class="div-bloque"><td colspan="${3+dias.length+1}"></td></tr>`);
  if(rodales.length===0){
    filas.push(`<tr>
      <td class="grupo g-aprov">Aprov. Trozado</td>
      <td class="grupo g-sub">Productos</td>
      <td class="lbl">Sin datos de rodales</td>
      ${dias.map(()=>'<td>—</td>').join('')}
      <td class="resumen">—</td>
    </tr>`);
  }else{
    let primeraFilaAprov=true;
    let filasAprovAcum=0;
    rodales.forEach((rodal,idxRodal)=>{
      const r=rodalMap[rodal];
      const clsB=idxRodal%2===0?'rodal-a':'rodal-b';
      const nFilasEsteRodal=1+tiposAprov.length; // cabecera + 4 tipos
      // Fila cabecera rodal
      const grupoCell=primeraFilaAprov?`<td class="grupo g-aprov" rowspan="${nAprov}">Aprov. Trozado</td>`:'';
      const subCell=`<td class="grupo g-sub" rowspan="${nFilasEsteRodal}">Rodal ${rodal}</td>`;
      filas.push(`<tr class="${clsB}">${grupoCell}${subCell}<td class="lbl" style="font-weight:700">RODAL: ${rodal}</td>${dias.map(()=>'<td></td>').join('')}<td class="resumen"></td></tr>`);
      primeraFilaAprov=false;
      // Filas tipos
      tiposAprov.forEach(([lbl,key])=>{
        const valsPorDia=dias.map(f=>{const e=r[f];return e!=null&&e[key]!=null?e[key]:null;});
        const conDato=valsPorDia.filter(v=>v!=null);
        const promedio=conDato.length?Math.round(conDato.reduce((a,b)=>a+b,0)/conDato.length):null;
        // Meta = valor más frecuente (moda) entre los días reportados
        const metaVal=conDato.length?conDato.reduce((a,b,_,arr)=>
          arr.filter(v=>v===a).length>=arr.filter(v=>v===b).length?a:b, conDato[0]):null;
        // Etiqueta con meta entre paréntesis
        const metaStr=metaVal!=null?` <span class="meta-lbl">(ET: ${metaVal}%)</span>`:'';
        const celdas=valsPorDia.map(v=>`<td>${v!=null?v+'%':'—'}</td>`).join('');
        // Resumen: color por criterio ±3% respecto a meta
        let resumenCls='',resumenTxt='—';
        if(promedio!=null){
          resumenTxt=promedio+'%';
          if(metaVal!=null){
            resumenCls=Math.abs(promedio-metaVal)<=3?'azul':'rojo';
          }
        }
        filas.push(`<tr class="${clsB}"><td class="lbl" style="padding-left:22px">${lbl}${metaStr}</td>${celdas}<td class="resumen ${resumenCls}">${resumenTxt}</td></tr>`);
      });
    });
  }

  // ─────────────────────────────────────────────
  // BLOQUE BODEGA FAENA (3 filas)
  // ─────────────────────────────────────────────
  const bodFilas=[
    {lbl:'Stock Madera Aserrable', val:stock.aserrable},
    {lbl:'Stock Madera Pulpable',  val:stock.pulpable},
    {lbl:'Stock Madera Manchada',  val:stock.manchada}
  ];
  // Divisor antes de Bodega
  filas.push(`<tr class="div-bloque"><td colspan="${3+dias.length+1}"></td></tr>`);
  bodFilas.forEach(({lbl,val},i)=>{
    const grupoCell=i===0?`<td class="grupo g-bod" rowspan="${bodFilas.length}">Bodega Faena</td>`:'';
    const subCell=i===0?`<td class="grupo g-sub" rowspan="${bodFilas.length}">Stock</td>`:'';
    filas.push(`<tr>${grupoCell}${subCell}<td class="lbl">${lbl}</td>${dias.map(()=>'<td>—</td>').join('')}<td class="resumen">${val}</td></tr>`);
  });

  $id('tbody-ddd').innerHTML=filas.join('');
}

function seccionFila(titulo){
  return `<tr class="seccion"><td class="lbl" colspan="1">${titulo}</td></tr>`;
}

// decimales: 0 = entero, 1 = 1 decimal, 2 = 2 decimales
function filaSimple(lbl,vals,total,claseFn,decimales,sufijo){
  decimales=decimales===undefined?0:decimales;
  sufijo=sufijo||'';
  const fmtV=v=>v==null?'—':(fmt(v,decimales)+sufijo);
  const celdas=vals.map(v=>{
    const cls=claseFn?claseFn(v):'';
    return `<td class="${cls}">${fmtV(v)}</td>`;
  }).join('');
  const clsTotal=claseFn?claseFn(total):'';
  return `<tr><td class="lbl">${lbl}</td>${celdas}<td class="resumen ${clsTotal}">${fmtV(total)}</td></tr>`;
}

init();
</script>

<!-- SERVICE WORKER -->
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          nw.postMessage({type:'SKIP_WAITING'});
          navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
        }
      });
    });
  });
}
</script>
