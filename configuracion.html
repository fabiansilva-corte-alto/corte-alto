<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a3a1a">
<title>Configuración — Corte Alto</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo.png">
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --verde-oscuro:#1a3a1a;
    --verde-medio:#2d5a2d;
    --verde-claro:#e8f0e8;
    --gris-fondo:#f4f6f4;
    --borde:#d5ded5;
    --rojo:#c0392b;
    --ambar:#b8860b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--gris-fondo);
    color:#222;
    padding-bottom:40px;
  }
  header{
    background:linear-gradient(135deg,var(--verde-oscuro),var(--verde-medio));
    color:#fff;
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
  }
  header .back{
    font-size:22px;
    color:#fff;
    text-decoration:none;
    line-height:1;
    padding:4px 8px 6px 0;
  }
  header h1{font-size:17px;font-weight:700;line-height:1.2}
  header p{font-size:12px;opacity:.85}

  .tabs{
    display:flex;
    background:#fff;
    border-bottom:1px solid var(--borde);
    position:sticky;
    top:58px;
    z-index:40;
    overflow-x:auto;
  }
  .tabs button{
    flex:1;
    min-width:90px;
    border:none;
    background:none;
    padding:12px 6px;
    font-size:13px;
    font-weight:600;
    color:#666;
    border-bottom:3px solid transparent;
    cursor:pointer;
    white-space:nowrap;
  }
  .tabs button.activo{color:var(--verde-medio);border-bottom-color:var(--verde-medio)}

  main{max-width:640px;margin:0 auto;padding:14px}

  .panel{display:none}
  .panel.activo{display:block}

  .item-card{
    background:#fff;
    border:1px solid var(--borde);
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .item-info{flex:1;min-width:0}
  .item-titulo{font-size:14px;font-weight:700;color:#222}
  .item-sub{font-size:12px;color:#777;margin-top:2px}
  .item-acciones{display:flex;gap:14px;flex:none}
  .item-acciones button{
    background:none;border:none;font-size:18px;cursor:pointer;padding:2px;
  }
  .icon-editar{color:var(--verde-medio)}
  .icon-eliminar{color:var(--rojo)}

  .btn-agregar{
    width:100%;
    background:#fff;
    border:2px dashed var(--verde-medio);
    color:var(--verde-medio);
    padding:13px;border-radius:10px;
    font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;
  }

  .vacio{
    text-align:center;
    color:#999;
    font-size:13px;
    padding:30px 10px;
  }

  /* ==== Modal ==== */
  .overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.45);
    z-index:100;
    align-items:flex-end;
    justify-content:center;
  }
  .overlay.activo{display:flex}
  .modal{
    background:#fff;
    width:100%;
    max-width:640px;
    border-radius:16px 16px 0 0;
    padding:18px 16px 22px;
    max-height:88vh;
    overflow-y:auto;
  }
  .modal h3{font-size:16px;color:var(--verde-oscuro);margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:600;color:#444;margin:10px 0 4px}
  input,select{
    width:100%;
    padding:11px 10px;
    font-size:15px;
    border:1px solid var(--borde);
    border-radius:8px;
    background:#fff;
    color:#222;
    font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--verde-medio);border-color:var(--verde-medio)}

  .op-lista{margin-top:6px}
  .op-item{
    display:flex;gap:6px;align-items:center;
    margin-bottom:6px;
  }
  .op-item input{flex:1}
  .op-item .btn-x{
    background:#fde8e6;border:none;color:var(--rojo);
    width:38px;height:42px;border-radius:8px;font-size:16px;cursor:pointer;flex:none;
  }
  .btn-agregar-op{
    background:none;
    border:1.5px dashed var(--verde-medio);
    color:var(--verde-medio);
    width:100%;padding:9px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;margin-top:4px;
  }

  .modal-acciones{display:flex;gap:10px;margin-top:18px}
  .btn-primario{
    flex:1;
    background:var(--verde-medio);
    color:#fff;border:none;
    padding:14px;border-radius:10px;
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .btn-cancelar{
    flex:1;
    background:#fff;border:1.5px solid var(--borde);color:#666;
    padding:14px;border-radius:10px;
    font-size:15px;font-weight:700;cursor:pointer;
  }

  /* ==== Pantalla de clave ==== */
  .check-fila{display:flex;align-items:center;gap:8px;padding:6px 0}
  .check-fila input{width:auto;padding:0}
  .check-fila label{margin:0;font-size:14px;font-weight:500;color:#222}

  #pantalla-clave{
    position:fixed;inset:0;background:var(--gris-fondo);
    display:flex;align-items:center;justify-content:center;
    z-index:200;padding:20px;
  }
  .clave-card{
    background:#fff;border-radius:16px;padding:28px 24px;
    max-width:340px;width:100%;text-align:center;
    box-shadow:0 4px 20px rgba(0,0,0,.1);
  }
  .clave-card h2{color:var(--verde-oscuro);font-size:18px;margin-bottom:6px}
  .clave-card p{color:#777;font-size:13px;margin-bottom:16px}
  .clave-card input{text-align:center;letter-spacing:4px;font-size:20px}
  .clave-error{color:var(--rojo);font-size:12px;margin-top:8px;display:none}
  .clave-error.visible{display:block}

  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--verde-oscuro);color:#fff;
    padding:10px 20px;border-radius:20px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .3s;
    z-index:300;
  }
  #toast.visible{opacity:1}
</style>
</head>
<body>

<div id="pantalla-clave">
  <div class="clave-card">
    <h2>🌲 Configuración</h2>
    <p>Ingresa la clave de acceso</p>
    <input type="password" id="input-clave" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="btn-primario" style="margin-top:14px" onclick="validarClave()">Ingresar</button>
    <div class="clave-error" id="clave-error">Clave incorrecta</div>
  </div>
</div>

<div id="app-contenido" style="display:none">

<header>
  <a href="index.html" class="back">←</a>
  <div>
    <h1>Configuración</h1>
    <p>Fundos, líneas, jefes y equipos</p>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn activo" data-tab="fundos" onclick="cambiarTab('fundos')">Fundos</button>
  <button class="tab-btn" data-tab="lineas" onclick="cambiarTab('lineas')">Líneas</button>
  <button class="tab-btn" data-tab="jefes" onclick="cambiarTab('jefes')">Jefes</button>
  <button class="tab-btn" data-tab="calibradores" onclick="cambiarTab('calibradores')">Calibradores</button>
  <button class="tab-btn" data-tab="operadores" onclick="cambiarTab('operadores')">Operadores</button>
  <button class="tab-btn" data-tab="equipos" onclick="cambiarTab('equipos')">Equipos</button>
  <button class="tab-btn" data-tab="volumen-meta" onclick="cambiarTab('volumen-meta')">Volumen Meta</button>
</div>

<main>

  <!-- ===== PANEL FUNDOS ===== -->
  <div class="panel activo" id="panel-fundos">
    <div id="lista-fundos"></div>
    <button class="btn-agregar" onclick="abrirModalFundo()">+ Agregar fundo</button>
  </div>

  <!-- ===== PANEL LÍNEAS ===== -->
  <div class="panel" id="panel-lineas">
    <div id="lista-lineas"></div>
    <button class="btn-agregar" onclick="abrirModalLinea()">+ Agregar línea</button>
  </div>

  <!-- ===== PANEL JEFES ===== -->
  <div class="panel" id="panel-jefes">
    <div id="lista-jefes"></div>
    <button class="btn-agregar" onclick="abrirModalJefe()">+ Agregar jefe de faena</button>
  </div>

  <!-- ===== PANEL CALIBRADORES ===== -->
  <div class="panel" id="panel-calibradores">
    <div id="lista-calibradores"></div>
    <button class="btn-agregar" onclick="abrirModalCalibrador()">+ Agregar calibrador</button>
  </div>

  <!-- ===== PANEL OPERADORES ===== -->
  <div class="panel" id="panel-operadores">
    <div id="lista-operadores"></div>
    <button class="btn-agregar" onclick="abrirModalOperador()">+ Agregar operador</button>
  </div>

  <!-- ===== PANEL EQUIPOS ===== -->
  <div class="panel" id="panel-equipos">
    <div id="lista-equipos"></div>
    <button class="btn-agregar" onclick="abrirModalEquipo()">+ Agregar equipo</button>
  </div>

  <!-- ===== PANEL VOLUMEN META ===== -->
  <div class="panel" id="panel-volumen-meta">
    <label>Línea</label>
    <select id="vm-linea" onchange="cargarVolumenMeta()"></select>

    <label>Mes</label>
    <select id="vm-mes" onchange="cargarVolumenMeta()">
      <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
      <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
      <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
      <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
    </select>

    <label>Año</label>
    <select id="vm-anio" onchange="cargarVolumenMeta()"></select>

    <label style="margin-top:14px">Pegar rango completo (copiado desde Excel)</label>
    <textarea id="vm-pegado" rows="3" placeholder="Pega aquí los valores del mes (uno por línea o separados por tab/espacio) y presiona 'Repartir en los días'" style="width:100%;padding:10px;border:1px solid var(--borde);border-radius:8px;font-family:inherit;font-size:13px;resize:vertical"></textarea>
    <button class="btn-agregar-op" style="margin-top:6px" onclick="repartirPegadoVolumenMeta()">📋 Repartir en los días</button>

    <div id="vm-grilla" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:14px"></div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:12px 14px;background:var(--verde-claro);border-radius:10px">
      <span style="font-size:13px;font-weight:700;color:var(--verde-oscuro)">Total volumen meta del mes</span>
      <span id="vm-total" style="font-size:16px;font-weight:800;color:var(--verde-oscuro)">0</span>
    </div>

    <button class="btn-primario" style="width:100%;margin-top:14px" onclick="guardarVolumenMeta()">Guardar</button>
  </div>

</main>

</div>

<!-- ===== MODAL FUNDO ===== -->
<div class="overlay" id="modal-fundo">
  <div class="modal">
    <h3 id="titulo-modal-fundo">Agregar fundo</h3>
    <input type="hidden" id="fundo-id">
    <label>Nombre del fundo <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="fundo-nombre" placeholder="Ej: LOS ALPES HIJ1">
    <label>Código <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="fundo-codigo" placeholder="Ej: 729" inputmode="numeric">
    <label>Código de cancha</label>
    <input type="text" id="fundo-codigo-cancha" placeholder="Ej: 45" inputmode="numeric">
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-fundo')">Cancelar</button>
      <button class="btn-primario" onclick="guardarFundo()">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL LÍNEA ===== -->
<div class="overlay" id="modal-linea">
  <div class="modal">
    <h3 id="titulo-modal-linea">Agregar línea</h3>
    <input type="hidden" id="linea-id">
    <label>Nombre de la línea <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="linea-nombre" placeholder="Ej: LÍNEA T1">
    <label>Fundo(s) asociado(s) <span style="color:var(--rojo)">*</span></label>
    <div id="linea-fundos-check" style="border:1px solid var(--borde);border-radius:8px;padding:8px 10px;max-height:180px;overflow-y:auto"></div>
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-linea')">Cancelar</button>
      <button class="btn-primario" onclick="guardarLinea()">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL JEFE ===== -->
<div class="overlay" id="modal-jefe">
  <div class="modal">
    <h3 id="titulo-modal-jefe">Agregar jefe de faena</h3>
    <input type="hidden" id="jefe-id">
    <label>Nombre completo <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="jefe-nombre" placeholder="Ej: GABRIEL CAYUMAN">
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-jefe')">Cancelar</button>
      <button class="btn-primario" onclick="guardarJefe()">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL CALIBRADOR ===== -->
<div class="overlay" id="modal-calibrador">
  <div class="modal">
    <h3 id="titulo-modal-calibrador">Agregar calibrador</h3>
    <input type="hidden" id="calibrador-id">
    <label>Nombre completo <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="calibrador-nombre" placeholder="Ej: JUAN PÉREZ">
    <label>RUT</label>
    <input type="text" id="calibrador-rut" placeholder="Ej: 22.284.895-4">
    <label>Fecha de acreditación</label>
    <input type="date" id="calibrador-acreditacion">
    <label>Vencimiento de acreditación</label>
    <input type="date" id="calibrador-vencimiento">
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-calibrador')">Cancelar</button>
      <button class="btn-primario" onclick="guardarCalibrador()">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL OPERADOR ===== -->
<div class="overlay" id="modal-operador">
  <div class="modal">
    <h3 id="titulo-modal-operador">Agregar operador</h3>
    <input type="hidden" id="operador-id">
    <label>Nombre completo <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="operador-nombre" placeholder="Ej: FLAVIO ACUÑA">
    <label>Función(es) <span style="color:var(--rojo)">*</span></label>
    <div style="border:1px solid var(--borde);border-radius:8px;padding:8px 10px">
      <div class="check-fila"><input type="checkbox" id="fn-trozado" value="OP TROZADO"><label for="fn-trozado">Op. Trozado</label></div>
      <div class="check-fila"><input type="checkbox" id="fn-clasificado" value="OP CLASIFICADO"><label for="fn-clasificado">Op. Clasificado</label></div>
      <div class="check-fila"><input type="checkbox" id="fn-volteo" value="VOLTEO"><label for="fn-volteo">Volteo</label></div>
      <div class="check-fila"><input type="checkbox" id="fn-madereo-skidder" value="MADEREO SKIDDER"><label for="fn-madereo-skidder">Madereo (Skidder)</label></div>
      <div class="check-fila"><input type="checkbox" id="fn-madereo-torre" value="MADEREO TORRE"><label for="fn-madereo-torre">Madereo (Torre)</label></div>
    </div>
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-operador')">Cancelar</button>
      <button class="btn-primario" onclick="guardarOperador()">Guardar</button>
    </div>
  </div>
</div>

<!-- ===== MODAL EQUIPO ===== -->
<div class="overlay" id="modal-equipo">
  <div class="modal">
    <h3 id="titulo-modal-equipo">Agregar equipo</h3>
    <input type="hidden" id="equipo-id">
    <label>Nombre del equipo <span style="color:var(--rojo)">*</span></label>
    <input type="text" id="equipo-nombre" placeholder="Ej: ALPINE-1">
    <label>Tipo de equipo <span style="color:var(--rojo)">*</span></label>
    <select id="equipo-tipo" onchange="actualizarVisibilidadOperadores(); renderCheckOperadoresEnEquipo();">
      <option value="">Selecciona...</option>
      <option value="TORRE">TORRE</option>
      <option value="SKIDDER">SKIDDER</option>
      <option value="PROCESADOR">PROCESADOR</option>
      <option value="SHOVEL">SHOVEL</option>
      <option value="HUINCHE DE ASISTENCIA">HUINCHE DE ASISTENCIA</option>
      <option value="GARRA ORDENADORA">GARRA ORDENADORA</option>
    </select>
    <label>Rol del equipo <span style="color:var(--rojo)">*</span></label>
    <select id="equipo-rol" onchange="actualizarVisibilidadOperadores()">
      <option value="PRINCIPAL">Principal</option>
      <option value="APOYO">Apoyo</option>
    </select>
    <div id="bloque-operadores-equipo">
      <label>Operadores anexados</label>
      <div id="op-check-lista" style="border:1px solid var(--borde);border-radius:8px;padding:8px 10px;max-height:220px;overflow-y:auto"></div>
    </div>
    <div class="modal-acciones">
      <button class="btn-cancelar" onclick="cerrarModal('modal-equipo')">Cancelar</button>
      <button class="btn-primario" onclick="guardarEquipo()">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
/* ============================================================
   FIREBASE — CONFIGURACIÓN
   ⚠️ FABIÁN: pega aquí el mismo bloque firebaseConfig que usan
   inicio-faena.html, produccion-diaria.html y productividad-jefe.html
   (proyecto reporte-inicio-faena-forestal). Solo reemplaza los valores.
   ============================================================ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache,
  collection, addDoc, updateDoc, deleteDoc, doc,
  query, orderBy, getDocs, onSnapshot, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBCAK6CdwawIyo4IjsJedNx_KkR_4ROqN4",
  authDomain: "reporte-inicio-faena-forestal.firebaseapp.com",
  projectId: "reporte-inicio-faena-forestal",
  storageBucket: "reporte-inicio-faena-forestal.appspot.com",
  messagingSenderId: "962534414054",
  appId: "1:962534414054:web:fa43371d31413fc0524d27"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const COL_FUNDOS = "config_fundos";
const COL_LINEAS = "config_lineas";
const COL_JEFES = "config_jefes_faena";
const COL_CALIBRADORES = "config_calibradores";
const COL_OPERADORES = "config_operadores";
const COL_EQUIPOS = "config_equipos";
const COL_VOLUMEN_META = "config_volumen_meta";

const CLAVE_ACCESO = "1771";

/* ============================================================
   ESTADO EN MEMORIA
   ============================================================ */
let fundos = [];
let lineas = [];
let jefes = [];
let calibradores = [];
let operadores = [];
let equipos = [];

/* ============================================================
   CONTROL DE ACCESO
   ============================================================ */
window.validarClave = function(){
  const valor = document.getElementById('input-clave').value.trim();
  if (valor === CLAVE_ACCESO){
    document.getElementById('pantalla-clave').style.display = 'none';
    document.getElementById('app-contenido').style.display = 'block';
    iniciarEscuchas();
  } else {
    document.getElementById('clave-error').classList.add('visible');
  }
};
document.getElementById('input-clave').addEventListener('keydown', e=>{
  if(e.key === 'Enter') window.validarClave();
});

/* ============================================================
   TABS
   ============================================================ */
window.cambiarTab = function(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('activo'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('activo'));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('activo');
  document.getElementById(`panel-${tab}`).classList.add('activo');
  if(tab === 'volumen-meta' && typeof window.cargarVolumenMeta === 'function') window.cargarVolumenMeta();
};

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(()=>t.classList.remove('visible'), 2200);
}

/* ============================================================
   ESCUCHAS EN TIEMPO REAL
   ============================================================ */
function iniciarEscuchas(){
  onSnapshot(query(collection(db, COL_FUNDOS), orderBy('nombre')), snap=>{
    fundos = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderFundos();
    renderSelectFundoEnLinea();
  });
  onSnapshot(query(collection(db, COL_LINEAS), orderBy('nombre')), snap=>{
    lineas = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderLineas();
  });
  onSnapshot(query(collection(db, COL_JEFES), orderBy('nombre')), snap=>{
    jefes = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderJefes();
  });
  onSnapshot(query(collection(db, COL_CALIBRADORES), orderBy('nombre')), snap=>{
    calibradores = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderCalibradores();
  });
  onSnapshot(query(collection(db, COL_OPERADORES), orderBy('nombre')), snap=>{

   ============================================================ */
function calcularEstadoVencimiento(fechaStr){
  if(!fechaStr) return null;
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const venc = new Date(fechaStr + 'T00:00:00');
  const dias = Math.round((venc - hoy) / 86400000);
  let color, texto, nivel;
  if(dias < 0){ color='var(--rojo)'; nivel='rojo'; texto=`Vencida hace ${Math.abs(dias)} día(s)`; }
  else if(dias <= 30){ color='var(--rojo)'; nivel='rojo'; texto=`Vence en ${dias} día(s)`; }
  else if(dias <= 40){ color='var(--ambar)'; nivel='amarillo'; texto=`Vence en ${dias} día(s)`; }
  else { color='var(--verde-medio)'; nivel='verde'; texto=`Vence en ${dias} día(s)`; }
  const fechaFormateada = venc.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric'});
  return { color, nivel, texto, fechaFormateada, dias };
}

  ).map(c => c.value);
  if(!nombre || !tipo){ toast('Completa nombre y tipo'); return; }
  if(!sinOperador && operadoresSel.length === 0){ toast('Selecciona al menos un operador'); return; }
  try{
    if(id){
      await updateDoc(doc(db, COL_EQUIPOS, id), { nombre, tipo, rol, operadores: operadoresSel });
      toast('Equipo actualizado');
    } else {
      await addDoc(collection(db, COL_EQUIPOS), { nombre, tipo, rol, operadores: operadoresSel });
      toast('Equipo agregado');
    }
    cerrarModal('modal-equipo');
  } catch(e){
    toast('Error al guardar: ' + e.message);
  }
};

window.eliminarEquipo = async function(id, nombre){
  if(!confirm(`¿Eliminar el equipo "${nombre}"?`)) return;
  try{
    await deleteDoc(doc(db, COL_EQUIPOS, id));
    toast('Equipo eliminado');
  } catch(e){
    toast('Error al eliminar: ' + e.message);
  }
};

/* ============================================================
   VOLUMEN META DIARIO
   Documento por línea+mes+año, con un array de valores (uno por
   día) y el total calculado. ID del doc: LINEA_AAAA-MM
   ============================================================ */
function diasDelMes(mes, anio){
  return new Date(anio, mes + 1, 0).getDate();
}

function idVolumenMeta(linea, mes, anio){
  const mesStr = String(mes + 1).padStart(2, '0');
  return `${linea}_${anio}-${mesStr}`;
}

function poblarSelectAnioVolumenMeta(){
  const sel = document.getElementById('vm-anio');
  const actual = sel.value;
  const anioHoy = new Date().getFullYear();
  const anios = [anioHoy - 1, anioHoy, anioHoy + 1];
  sel.innerHTML = anios.map(a => `<option value="${a}">${a}</option>`).join('');
  if(actual && anios.includes(Number(actual))) sel.value = actual;
  else sel.value = String(anioHoy);
}

function poblarSelectLineaVolumenMeta(){
  const sel = document.getElementById('vm-linea');
  const actual = sel.value;
  const nombres = [...new Set(lineas.map(l => l.nombre))];
  sel.innerHTML = nombres.length
    ? nombres.map(n => `<option>${n}</option>`).join('')
    : '<option value="">Agrega líneas primero</option>';
  if(actual && nombres.includes(actual)) sel.value = actual;
}

function renderGrillaVolumenMeta(valores, totalDias){
  const cont = document.getElementById('vm-grilla');
  cont.innerHTML = '';
  for(let d = 1; d <= totalDias; d++){
    const div = document.createElement('div');
    div.innerHTML = `
      <label style="font-size:10px;color:#888;text-align:center;display:block;margin-bottom:2px">Día ${d}</label>
      <input type="number" step="any" data-dia="${d}" value="${valores[d-1] ?? ''}" style="width:100%;padding:6px 4px;text-align:center;font-size:12px;border:1px solid var(--borde);border-radius:6px" oninput="actualizarTotalVolumenMeta()">
    `;
    cont.appendChild(div);
  }
}

window.actualizarTotalVolumenMeta = function(){
  const inputs = document.querySelectorAll('#vm-grilla input');
  let total = 0;
  inputs.forEach(inp => { total += Number(inp.value) || 0; });
  document.getElementById('vm-total').textContent = total.toLocaleString('es-CL', {maximumFractionDigits:2});
};

window.repartirPegadoVolumenMeta = function(){
  const texto = document.getElementById('vm-pegado').value;
  if(!texto.trim()){ toast('Pega primero los valores'); return; }
  // Separa por salto de línea, tabulación, coma o espacios múltiples
  const valores = texto.split(/[\n\t,;]+/).map(v => v.trim()).filter(v => v.length > 0).map(v => v.replace(',', '.'));
  const inputs = document.querySelectorAll('#vm-grilla input');
  if(valores.length === 0){ toast('No se detectaron valores'); return; }
  inputs.forEach((inp, i) => {
    if(valores[i] !== undefined) inp.value = valores[i];
  });
  window.actualizarTotalVolumenMeta();
  const faltantes = inputs.length - valores.length;
  if(faltantes > 0) toast(`Se repartieron ${valores.length} valores. Faltan ${faltantes} día(s) por completar.`);
  else if(valores.length > inputs.length) toast(`Se pegaron más valores (${valores.length}) que días tiene el mes (${inputs.length}). Sobran ${valores.length - inputs.length}.`);
  else toast('Valores repartidos en todos los días');
};

window.cargarVolumenMeta = async function(){
  const linea = document.getElementById('vm-linea').value;
  const mes = Number(document.getElementById('vm-mes').value);
  const anio = Number(document.getElementById('vm-anio').value);
  if(!linea) return;
  const totalDias = diasDelMes(mes, anio);
  let valores = [];
  try{
    const snap = await getDoc(doc(db, COL_VOLUMEN_META, idVolumenMeta(linea, mes, anio)));
    if(snap.exists()) valores = snap.data().valores || [];
  }catch(e){ /* sin conexión: se muestra la grilla vacía */ }
  renderGrillaVolumenMeta(valores, totalDias);
  document.getElementById('vm-pegado').value = '';
  window.actualizarTotalVolumenMeta();
};

window.guardarVolumenMeta = async function(){
  const linea = document.getElementById('vm-linea').value;
  const mes = Number(document.getElementById('vm-mes').value);
  const anio = Number(document.getElementById('vm-anio').value);
  if(!linea){ toast('Selecciona una línea'); return; }
  const inputs = document.querySelectorAll('#vm-grilla input');
  const valores = Array.from(inputs).map(inp => inp.value === '' ? null : Number(inp.value));
  const total = valores.reduce((s,v) => s + (v || 0), 0);
  try{
    await setDoc(doc(db, COL_VOLUMEN_META, idVolumenMeta(linea, mes, anio)), {
      linea, mes, anio, valores, total
    });
    toast('Volumen meta guardado');
  }catch(e){
    toast('Error al guardar: ' + e.message);
  }
};

// Inicializa selects de año y línea al cargar (línea depende de que 'lineas' ya tenga datos)
poblarSelectAnioVolumenMeta();
const _origRenderLineas = renderLineas;
renderLineas = function(){
  _origRenderLineas();
  poblarSelectLineaVolumenMeta();
  if(document.getElementById('panel-volumen-meta').classList.contains('activo')) window.cargarVolumenMeta();
};

/* ============================================================
   MODALES — CERRAR
   ============================================================ */
window.cerrarModal = function(idModal){
  document.getElementById(idModal).classList.remove('activo');
};

</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
      reg.addEventListener('updatefound', () => {
        const nuevoWorker = reg.installing;
        nuevoWorker.addEventListener('statechange', () => {
          if (nuevoWorker.state === 'installed' && navigator.serviceWorker.controller) {
            nuevoWorker.postMessage('SKIP_WAITING');
          }
        });
      });
      reg.update();
    }).catch(() => {});

    let yaRecargo = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (yaRecargo) return;
      yaRecargo = true;
      window.location.reload();
    });
  });
}
</script>
